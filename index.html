safeAttack:{chapter:'第二十四章　第二の事件',time:'21:14',place:'帳場',bg:'lobby',mood:'night',night:true,chars:[{pos:'C',cls:'senior coat'}],text:'帳場の方から大きな音がした。\\n\\n駆けつける。\\n\\n重蔵さんが床に倒れている。\\n\\n意識はある。\\n\\n金庫の扉が開いている。\\n\\n鍵は首からなくなっていた。\\n\\n中の現金には手がつけられていない。\\n\\nなくなったのは、黒いケースだけ。',next:'objectPattern'},
playerAttack:{chapter:'BAD END',time:'21:13',place:'一階廊下',bg:'corridor',mood:'night',night:true,chars:[],text:'停電。\\n\\n背後で床が鳴った。\\n\\n振り返るより先に、首に衝撃が走った。\\n\\nポケットを探られる感触。\\n\\n黒いケース。\\n\\n――それが最後に分かったことだった。',choices:[{label:'エンディングを見る',next:()=>{ending('目撃者','目的物を自分で持ったことで、犯人の次の標的になった。');return 'noop'}}]},
objectPattern:{chapter:'第二十五章　物を追う影',time:'21:32',place:'食堂',bg:'dining',mood:'uneasy',night:true,chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'二つの事件。\\n\\n三木さんが殺された。\\n次に狙われたのは、別の人。\\n\\n人間関係には共通点が薄い。\\n\\nでも、一つだけ。\\n\\n黒いケースの場所が変わるたび、危険も移っている。',choices:[{label:'犯人は人ではなく物を追っている',next:'theoryObject',effect:()=>{state.flags.objectTheory=true;state.clues+=3}},{label:'偶然だと思う',next:'badDoubt'},{label:'全員にケースの正体を大声で話す',next:'badPublic'}]},
theoryObject:{chapter:'第二十五章　物を追う影',time:'21:37',place:'食堂',bg:'dining',mood:'uneasy',night:true,chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「三木さんが狙われたのも、持ってたから？」\\n\\n「たぶん」\\n\\n「じゃあ次の人が変わったのは……」\\n\\n「ケースが移ったから」\\n\\n犯人は最初から全員を殺したいわけじゃない。\\n\\n欲しい物がある。\\n\\nそして、それを手に入れるまで止まらない。',next:'deadlineTheory'},
deadlineTheory:{chapter:'第二十五章　物を追う影',time:'21:42',place:'食堂',bg:'dining',mood:'uneasy',night:true,chars:[{pos:'L',cls:'female'},{pos:'R',cls:'coat'}],text:'もう一つ。\\n\\n犯人は焦っている。\\n\\n雪がやめば警察が来る。\\n道路が開けば全員が外へ出る。\\n\\nつまり今夜しかない。\\n\\n犯人には時間制限がある。',choices:[{label:'昨日からの発言を洗い直す',next:'reviewWords',effect:()=>state.clues+=2},{label:'全員を縛って朝を待つ',next:'badAllTie'},{label:'証拠を燃やして事件を終わらせる',next:'badBurnEvidence'}]},
badDoubt:{chapter:'BAD END',time:'23:56',place:'雪待庵',bg:'night',mood:'night',night:true,chars:[],text:'ケースと事件の関係を偶然だと考えた。\\n\\nその夜、三度目の襲撃が起きた。\\n\\nそして四度目。\\n\\n最後まで僕たちは、“人”ばかりを見ていた。',choices:[{label:'エンディングを見る',next:()=>{ending('犯人の思う壺','標的が変わる理由に気づけず、犯人の目的通りに混乱させられた。');return 'noop'}}]},
badPublic:{chapter:'BAD END',time:'21:48',place:'食堂',bg:'dining',mood:'night',night:true,chars:[],text:'僕はケースの正体と現在地を全員の前で話した。\\n\\n犯人にも聞こえるように。\\n\\nその十五分後。\\n\\n再び停電した。\\n\\n今度は、犯人が迷う必要すらなかった。',choices:[{label:'エンディングを見る',next:()=>{ending('全部話せ','安全のため共有した情報が、そのまま犯人への案内になった。');return 'noop'}}]},
badAllTie:{chapter:'BAD END',time:'22:18',place:'食堂',bg:'dining',mood:'night',night:true,chars:[],text:'全員を縛れば安全。\\n\\n理屈ではそうだった。\\n\\n問題は、誰が誰を縛るかだった。\\n\\n疑心暗鬼の中で揉み合いになり、ストーブが倒れた。\\n\\n火は一瞬で障子へ移った。',choices:[{label:'エンディングを見る',next:()=>{ending('火','犯人を封じるための強硬策が、旅館全体を危険にした。');return 'noop'}}]},
badBurnEvidence:{chapter:'BAD END',time:'21:53',place:'厨房',bg:'dining',mood:'night',night:true,chars:[],text:'「これを燃やせば、もう狙う理由はない」\\n\\nそう考えた。\\n\\n黒いケースを火へ入れる。\\n\\nだが犯人が欲しかったのは“物”そのものではない。\\n\\n中身が外へ出ないこと。\\n\\n証拠を消した瞬間、僕たちは犯人の目的を代わりに達成してしまった。',choices:[{label:'エンディングを見る',next:()=>{ending('犯人の思う壺','危険を避けるつもりで、犯人が最も望んでいた証拠隠滅を手伝ってしまった。');return 'noop'}}]},
reviewWords:{chapter:'第二十六章　言葉の矛盾',time:'22:02',place:'談話室',bg:'lounge',mood:'uneasy',night:true,chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「事件が起きる前の会話を思い出そう」\\n\\n何気ない言葉。\\n冗談。\\n自己紹介。\\n写真の話。\\n仕事の話。\\n\\nその中に、今になって意味が変わる言葉がある。',choices:[{label:'森川さんの「事件記事をやっていた」',next:'moriWords',effect:()=>state.clues++},{label:'黒田さんの会社の話',next:'kurodaWords'},{label:'千秋さんの父親への不満',next:'chiakiWords'}]},
moriWords:{chapter:'第二十六章　言葉の矛盾',time:'22:06',place:'談話室',bg:'lounge',mood:'uneasy',night:true,chars:[{pos:'C',cls:'coat'}],text:'森川さんは雑誌編集者。\\n昔は事件記事も担当したと言った。\\n\\nそして今朝、黒田さんに「東京の本社勤めは大変だろ」と声をかけた。\\n\\n黒田さんは会社名を言っていない。\\n\\nなぜ森川さんは“本社”を知っていた？\\n\\n取引先だったから？\\nそれとも、もっと前から黒田さんを知っていた？',next:'moriInterview'},
kurodaWords:{chapter:'第二十六章　言葉の矛盾',time:'22:06',place:'談話室',bg:'lounge',mood:'uneasy',night:true,chars:[{pos:'C',cls:'coat'}],text:'黒田さんは借金と退職を隠していた。\\n\\n十分怪しい。\\n\\nだが、その秘密は自分から証拠まで見せた。\\n\\nそして二度目の事件時、黒田さんは篠崎先生と同じ場所にいた。\\n\\n少なくとも、すべての事件を一人で起こすのは難しい。',next:'moriInterview'},
chiakiWords:{chapter:'第二十六章　言葉の矛盾',time:'22:06',place:'談話室',bg:'lounge',mood:'uneasy',night:true,chars:[{pos:'L',cls:'female short'}],text:'千秋さんは父親とぎくしゃくしている。\\n\\n旅館を継ぐつもりもないらしい。\\n\\nでも、それは家族の秘密だ。\\n\\n三木さんの写真とも、黒いケースともつながらない。\\n\\n“怪しい事情”と“事件につながる事情”を分けなければならない。',next:'moriInterview'},
moriInterview:{chapter:'第二十六章　言葉の矛盾',time:'22:13',place:'食堂',bg:'dining',mood:'uneasy',night:true,chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「俺を疑ってる？」\\n\\n森川さんは笑った。\\n\\n「別にいいけど。理由は？」\\n\\n僕は黒田さんの会社のこと、事件記事のこと、午後に姿がなかった時間を挙げた。\\n\\n森川さんは一つずつ答える。\\n\\n「黒田さんの会社は業界じゃ有名。午後は寝てた。髪は顔を洗った時に濡れた」\\n\\nどれも、あり得ない答えではない。',choices:[{label:'髪が濡れるほど顔を洗う？',next:'wetHair'},{label:'事件記事を辞めた理由を聞く',next:'whyLeftNews'},{label:'ここでは決めつけない',next:'motiveSearch'}]},
wetHair:{chapter:'第二十六章　言葉の矛盾',time:'22:17',place:'食堂',bg:'dining',mood:'uneasy',night:true,chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「汗かいてたんだよ」\\n\\n森川さんの答えは早かった。\\n\\n雪の日の午後。\\n寝ていた人間が、汗をかく？\\n\\n小さな矛盾。\\n\\nそれだけでは犯人とは言えない。\\n\\nでも、午後二時台に彼が“寝ていなかった”可能性は高くなった。',next:'motiveSearch'},
whyLeftNews:{chapter:'第二十六章　言葉の矛盾',time:'22:17',place:'食堂',bg:'dining',mood:'uneasy',night:true,chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「疲れたからだよ」\\n\\n「何に？」\\n\\n「人の不幸で飯食うのに」\\n\\n一瞬だけ、笑顔が消えた。\\n\\n「旅行記事なら誰も死なない」\\n\\n皮肉な言葉だった。\\n\\n少なくとも、昨日までは。',next:'motiveSearch'},
motiveSearch:{chapter:'第二十七章　なぜ今夜なのか',time:'22:31',place:'談話室',bg:'lounge',mood:'uneasy',night:true,chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],text:'ケースの中身が会社の不正を写したネガなら。\\n\\n犯人は、それが外へ出ると困る人物。\\n\\nあるいは、困る人物に頼まれた誰か。\\n\\nそして犯人は、この旅行が終わる前に回収する必要があった。',choices:[{label:'亜希さんに不正の相手を聞く',next:'akiNames',effect:()=>state.clues+=2},{label:'黒田さんと森川さんの関係を確認する',next:'crossCheck',effect:()=>state.clues++},{label:'ケースを開けて中身を確認する',next:'openCase'}]},
akiNames:{chapter:'第二十七章　なぜ今夜なのか',time:'22:36',place:'談話室',bg:'lounge',mood:'uneasy',night:true,chars:[{pos:'L',cls:'female short'}],name:'真島 亜希',text:'「会社のお金を外に流してる人がいた」\\n\\n亜希さんはようやく全部話した。\\n\\n「取引先を使って架空の請求を作ってた。担当の名前も分かった。でも、社内だけじゃない」\\n\\n「外にも？」\\n\\n「うん。取引先と、情報を仲介してる人」\\n\\nその“仲介”という言葉に、森川さんの仕事が重なった。',next:'crossCheck'},
crossCheck:{chapter:'第二十七章　なぜ今夜なのか',time:'22:42',place:'食堂',bg:'dining',mood:'uneasy',night:true,chars:[{pos:'C',cls:'coat'}],name:'黒田 和也',text:'「森川さんとは、以前一度だけ会っています」\\n\\n黒田さんが言った。\\n\\n全員が森川さんを見る。\\n\\n「取引先の宴席で。彼は記事の取材だと言っていました」\\n\\n森川さんの表情は変わらない。\\n\\n「覚えてないな」\\n\\n黒田さんは続ける。\\n\\n「私は覚えています。あの時、会社の内部資料を欲しがっていた」',next:'moriCorner'},
openCase:{chapter:'第二十七章　なぜ今夜なのか',time:'22:39',place:'談話室',bg:'lounge',mood:'uneasy',night:true,chars:[],text:'ケースを開ける。\\n\\n中には短いネガフィルム。\\n\\n裸眼では何が写っているか分からない。\\n\\n三木さんの簡易ルーペを使う。\\n\\n帳簿。伝票。社名。金額。\\n\\nそして一枚だけ、書類の端に人の手と名刺が写っていた。\\n\\n名刺の文字。\\n\\n――森川。',next:'moriCorner'},
moriCorner:{chapter:'第二十八章　指名',time:'22:51',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'状況は一人へ集まり始めている。\\n\\nでも、“怪しい”だけでは足りない。\\n\\n三木さんを殺したこと。\\nケースを追ったこと。\\n亜希さんの証拠とつながっていること。\\n\\n全部を説明できなければ、ただの決めつけになる。',choices:[{label:'森川俊夫を犯人として指名する',next:()=>state.clues>=7?'accuseMoriStrong':'accuseMoriWeak'},{label:'まだ指名せず罠を張る',next:'trapPlan'},{label:'黒田和也を指名する',next:'badWrong'}]},
accuseMoriWeak:{chapter:'GOOD END',time:'23:04',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'C',cls:'coat'}],text:'「森川さん。あなたですよね」\\n\\n森川さんの笑顔が消えた。\\n\\n状況証拠はある。\\n矛盾もある。\\n\\nだが決定打がない。\\n\\n朝、警察が到着し、森川さんは任意同行を求められた。\\n\\n僕には犯人が分かった。\\n\\nそれでも、なぜ三木さんまで殺す必要があったのか。\\nなぜケースが旅館を移動したのか。\\n\\n全貌までは届かなかった。',choices:[{label:'エンディングを見る',next:()=>{ending('犯人は分かった。それなのに','犯人には辿り着いたが、事件を動かした目的物と全行動の意味までは解けなかった。');return 'noop'}}]},
accuseMoriStrong:{chapter:'第二十八章　指名',time:'23:03',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'C',cls:'coat'}],name:'透司',text:'「森川さん。三木さんを殺したのは、あなたです」\\n\\n森川さんは何も言わない。\\n\\n「三木さんを狙っていたんじゃない。黒いケースを追っていた」\\n\\n空気が止まる。\\n\\n「ケースを持つ人間が変わるたび、襲われる人間も変わった」\\n\\n森川さんの目だけが、こちらを見た。',choices:[{label:'動機まで説明する',next:'explainMotive'},{label:'今すぐ取り押さえる',next:'bittersweet'}]},
explainMotive:{chapter:'第二十九章　真相',time:'23:08',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'C',cls:'coat'}],name:'透司',text:'「亜希さんは会社の不正の証拠をネガにして持ち出した。あなたはそれが外へ出ると困った」\\n\\n「だから旅行中に回収しようとした。最初に亜希さんの鞄を探った。でも見つからなかった」\\n\\n「その後、ケースは三木さんのフィルムに紛れた。あなたは三木さんが持っていると思った」\\n\\n「だから三木さんの部屋へ行った」\\n\\n森川さんの口元から笑みが消えた。',next:'explainMore'},
explainMore:{chapter:'第二十九章　真相',time:'23:11',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'C',cls:'coat'}],name:'透司',text:'「三木さんは、あなたが荷物を探るのを見た」\\n\\n「揉み合いになった。あなたは三木さんを殺した」\\n\\n「でもケースはまた移った。だから次の標的も変わった」\\n\\n「あなたは人を順番に殺していたんじゃない」\\n\\n「証拠を追っていたんだ」\\n\\n森川さんが、初めて深く息を吐いた。',next:'moriConfession'},
moriConfession:{chapter:'第二十九章　真相',time:'23:14',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「……三木は死ぬ予定じゃなかった」\\n\\n誰かが息を呑む。\\n\\n「鞄から取って終わるはずだった。亜希も黙らせるつもりはなかった」\\n\\n「ただ、証拠だけ消せばよかった」\\n\\n「なのに、あいつがケースを持ってた。部屋で見つかって……俺の顔を見た」\\n\\n声が低い。\\n\\n「一つ狂ったら、全部狂った」',next:'finalThreat'},
finalThreat:{chapter:'第三十章　最後の一手',time:'23:17',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'事件は解けた。\\n\\nそう思った瞬間。\\n\\n森川さんの視線が、ストーブ脇の非常用灯油へ動いた。\\n\\nそして僕は気づく。\\n\\n証拠が残っている限り、森川さんにとって事件は終わっていない。',choices:[{label:'ケースを持っているふりをして自分へ注意を向ける',next:'trueTrap',effect:()=>state.flags.finalTrap=true},{label:'全員で一斉に取り押さえる',next:'bittersweet'},{label:'ケースを窓から雪へ投げる',next:'badAlmost'}]},
trapPlan:{chapter:'第二十八章　罠',time:'22:57',place:'食堂',bg:'dining',mood:'uneasy',night:true,chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],text:'犯人を指名する前に、確かめる。\\n\\n僕たちは「ケースはまだ見つかっていない」と全員に伝えた。\\n\\nその一方で、ケースが“二階の楓の間にある”という嘘を、ある人物にだけ聞こえるように話した。',choices:[{label:'森川さんにだけ聞かせる',next:'trapWatch'},{label:'黒田さんにだけ聞かせる',next:'badWrong'}]},
trapWatch:{chapter:'第二十八章　罠',time:'23:19',place:'二階廊下',bg:'corridor',mood:'night',night:true,chars:[],text:'廊下を暗くして待つ。\\n\\nギシ。\\n\\nギシ。\\n\\n昨夜と同じ足音。\\n\\n楓の間の前で止まる。\\n\\n誰かが襖へ手をかけた。\\n\\n非常灯をつける。\\n\\n森川俊夫だった。',next:'accuseMoriStrong'},
bittersweet:{chapter:'GOOD END',time:'23:22',place:'食堂',bg:'dining',mood:'night',night:true,chars:[],text:'全員で森川さんを取り押さえた。\\n\\n犯人は捕まった。\\n動機も分かった。\\nケースも守った。\\n\\nだが揉み合いの中で、一人が重傷を負った。\\n\\n助かった命。\\n救えなかったもの。\\n\\n朝の雪は、何もなかったように白かった。',choices:[{label:'エンディングを見る',next:()=>{ending('雪解け','犯人・動機・目的物まで解明したが、最後の混乱で一人を完全には救えなかった。');return 'noop'}}]},
badAlmost:{chapter:'BAD END',time:'23:19',place:'玄関前',bg:'arrival',mood:'night',night:true,chars:[],text:'ケースを雪へ投げた。\\n\\n犯人も外へ飛び出した。\\n\\n吹雪の中、全員が追う。\\n\\n次の瞬間。\\n\\n山の上から低い音が響いた。\\n\\n雪面が動いた。\\n\\n逃げる方向を考える時間はなかった。',choices:[{label:'エンディングを見る',next:()=>{ending('雪崩','真相まであと一歩だったが、最後の行動が全員を自然の危険へ巻き込んだ。');return 'noop'}}]},
trueTrap:{chapter:'第三十章　最後の一手',time:'23:18',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'C',cls:'coat'}],name:'透司',text:'「ケースは僕が持ってる」\\n\\n嘘だった。\\n\\n本物はすでに別の場所に隠してある。\\n\\n森川さんの目が僕へ向く。\\n\\n真帆には、合図を決めていた。\\n千秋さんには裏口を閉めてもらった。\\n黒田さんと篠崎先生は左右に立っている。\\n\\n今度は、誰も一人ではない。',next:'trueAction'},
trueAction:{chapter:'第三十章　最後の一手',time:'23:19',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'森川さんが動いた。\\n\\nでも、一歩遅い。\\n\\n真帆が机を引く。\\n黒田さんが腕を押さえる。\\n篠崎先生が灯油缶を遠ざける。\\n\\n森川さんは床へ押さえ込まれた。\\n\\n今度こそ、本当に終わった。',next:'trueDawn'},
trueDawn:{chapter:'TRUE END',time:'06:47',place:'雪待庵・玄関前',bg:'arrival',mood:'snow',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'coat'}],text:'夜が明けた。\\n\\n除雪車の音。\\n警察の車。\\n\\n三木さんの部屋は封鎖され、森川さんは連れて行かれた。\\n\\n亜希さんのネガは警察へ渡った。\\n会社の不正も、これから調べられる。\\n\\n旅館の前には、昨日作った雪だるまがまだ立っていた。\\n\\n笑っていた昨日が、遠い。',next:'trueEpilogue'},
trueEpilogue:{chapter:'エピローグ',time:'07:03',place:'白嶺温泉・雪待庵',bg:'arrival',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「帰ろう、透司」\\n\\n真帆が手を差し出した。\\n\\n僕はその手を握る。\\n\\n屋根から雪が一筋、落ちた。\\n\\n最初の鞄。\\n桂馬。\\n夜の足音。\\n黒いケース。\\n何気ない会話。\\n\\n全部が、今なら意味を持って見える。\\n\\nでも僕が一番覚えているのは。\\n\\n事件が起きる前、十一人で撮った一枚の写真だった。',choices:[{label:'TRUE END',next:()=>{ending('TRUE END　ゆきがくれの夜','犯人、動機、目的物、標的が変わる理由、時間制限、事件前の伏線まで解き明かし、最後の犠牲も防いだ。');return 'noop'}}]}
};
SCENES.noop={text:'',next:null};

$('#newGame').addEventListener('click',()=>{initAudio();state={scene:'prologue1',flags:{},aff:{maho:0,chiaki:0,morikawa:0,miki:0,aki:0},clues:0,fun:0,seen:{},log:[],endings:meta().endings||[]};title.hidden=true;game.hidden=false;render('prologue1')});
$('#continueGame').addEventListener('click',manualLoad);$('#chapterSelect').addEventListener('click',()=>{initAudio();title.hidden=true;game.hidden=false;state.scene='prologue1';render('prologue1')});$('#openEndings').addEventListener('click',showEndings);
$('.textbox').addEventListener('click',e=>{if(e.target.closest('button'))return;advance()});$('#saveBtn').addEventListener('click',manualSave);$('#loadBtn').addEventListener('click',manualLoad);$('#logBtn').addEventListener('click',openLog);$('#settingsBtn').addEventListener('click',()=>$('#settingsPanel').classList.add('open'));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).classList.remove('open')));$('#openEndings').addEventListener('click',showEndings);$('#bgmVol').addEventListener('input',e=>{if(bgmGain)bgmGain.gain.value=e.target.value/100});$('#seVol').addEventListener('input',e=>{if(seGain)seGain.gain.value=e.target.value/100});$('#skipToggle').addEventListener('click',e=>{skip=!skip;e.target.textContent=skip?'ON':'OFF'});
showTitle();
})();
</script>
