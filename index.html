<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<title>ゆきがくれの夜 — 雪待庵編</title>
<style>
:root{--bg:#080a0e;--panel:rgba(8,10,14,.86);--panel2:rgba(20,24,30,.92);--line:rgba(255,255,255,.12);--text:#f3f5f7;--muted:#a8b0b8;--accent:#d7e3ed;--danger:#a93b3b;--gold:#d2bd8a}
*{box-sizing:border-box}html,body{margin:0;background:#05070a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;min-height:100%;overflow-x:hidden}button{font:inherit}body{background:radial-gradient(circle at 50% 15%,#202832 0,#0b0e12 44%,#05070a 100%)}
#app{min-height:100vh;display:flex;flex-direction:column}.screen{position:relative;flex:1;min-height:62vh;overflow:hidden;background:#111823}.bg{position:absolute;inset:0;transition:filter .7s,transform 1.2s,opacity .6s}.bg:before,.bg:after{content:"";position:absolute;inset:0}.bg:after{background:linear-gradient(to bottom,rgba(3,6,10,.03),rgba(3,6,10,.1) 42%,rgba(3,6,10,.7) 100%)}
.bg.arrival{background:linear-gradient(#aab9c4 0 45%,#d5dde2 45% 60%,#87939a 60% 100%)}.bg.arrival:before{left:8%;right:8%;top:38%;bottom:0;background:linear-gradient(#474b4e,#2e3235);clip-path:polygon(4% 12%,18% 0,82% 0,96% 12%,94% 100%,6% 100%);box-shadow:0 0 50px rgba(0,0,0,.4)}
.bg.lobby{background:linear-gradient(#2f2924,#181513 55%,#0f0e0d)}.bg.dining{background:radial-gradient(circle at 50% 35%,#4a3b2b,#1a1613 55%,#0e0d0c)}.bg.lounge{background:radial-gradient(circle at 45% 40%,#31343a,#15191e 60%,#0a0d10)}.bg.gameroom{background:linear-gradient(#30363a,#181d20 60%,#0b0e10)}.bg.corridor{background:linear-gradient(90deg,#201c19,#3c342e 48%,#1c1917);perspective:600px}.bg.room{background:linear-gradient(#302b28,#181514 64%,#0c0b0b)}.bg.night{filter:brightness(.65) saturate(.7)}
.snow{position:absolute;inset:-20%;pointer-events:none;background-image:radial-gradient(circle,#fff 0 1.4px,transparent 1.7px),radial-gradient(circle,#fff 0 1px,transparent 1.3px),radial-gradient(circle,#fff 0 2px,transparent 2.2px);background-size:74px 74px,108px 108px,146px 146px;background-position:0 0,40px 10px,10px 40px;opacity:.65;animation:snow 13s linear infinite}.snow.hidden{display:none}@keyframes snow{to{background-position:0 160px,40px 240px,10px 320px}}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 100px rgba(0,0,0,.8);pointer-events:none}.scene-label{position:absolute;left:14px;top:14px;background:rgba(3,5,8,.55);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 11px;color:#e9eef2;font-size:12px;backdrop-filter:blur(5px)}
.characters{position:absolute;inset:0;pointer-events:none}.char{position:absolute;bottom:-5%;width:26%;max-width:230px;height:72%;filter:drop-shadow(0 12px 12px rgba(0,0,0,.45));opacity:0;transform:translateY(20px) scale(.97);transition:.45s}.char.show{opacity:.92;transform:none}.char.left{left:7%}.char.center{left:37%}.char.right{right:7%}.char .head{position:absolute;width:29%;height:18%;left:35%;top:5%;background:#0a0b0d;border-radius:48% 48% 45% 45%}.char .body{position:absolute;width:62%;height:58%;left:19%;top:21%;background:#0a0b0d;border-radius:34% 34% 8% 8%;clip-path:polygon(24% 0,76% 0,92% 100%,8% 100%)}.char .leg1,.char .leg2{position:absolute;width:18%;height:27%;top:73%;background:#0a0b0d}.char .leg1{left:29%}.char .leg2{right:29%}.char.female .body{clip-path:polygon(30% 0,70% 0,86% 100%,14% 100%)}.char.coat .body{width:70%;left:15%;clip-path:polygon(18% 0,82% 0,94% 100%,6% 100%)}.char.senior .head{top:8%;height:16%}.char.short{height:65%}
.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}.flash.go{animation:flash .35s}@keyframes flash{0%{opacity:0}30%{opacity:.8}100%{opacity:0}}
.hud{position:absolute;right:12px;top:12px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.hud button{border:1px solid rgba(255,255,255,.16);background:rgba(3,5,8,.55);color:#dfe5ea;border-radius:10px;padding:7px 9px;font-size:12px;backdrop-filter:blur(5px)}
.textbox{position:relative;background:linear-gradient(rgba(7,9,13,.96),rgba(10,12,16,.99));border-top:1px solid var(--line);padding:17px 18px calc(18px + env(safe-area-inset-bottom));min-height:38vh}.name{height:24px;color:#e5d2a4;font-weight:700;letter-spacing:.04em}.text{font-size:17px;line-height:1.9;white-space:pre-wrap;min-height:150px;max-width:920px;margin:auto}.choices{max-width:920px;margin:14px auto 0;display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid #49515b;background:linear-gradient(#1c2229,#14191e);color:#f2f5f7;border-radius:12px;padding:13px 14px;min-height:48px;transition:.15s}.choice:active{transform:scale(.995);background:#252d34}.choice.subtle{border-color:#393f46;color:#c9d0d6}.meta{max-width:920px;margin:0 auto 9px;display:flex;justify-content:space-between;gap:10px;color:#919aa2;font-size:12px}.tap{display:flex;justify-content:flex-end;color:#7f8991;font-size:12px;margin-top:9px}
.title{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(#9eafb9 0 35%,#dfe5e8 36% 53%,#657078 54% 100%);position:relative;overflow:hidden}.title:before{content:"";position:absolute;left:4%;right:4%;bottom:0;height:48%;background:#303538;clip-path:polygon(7% 13%,18% 0,82% 0,93% 13%,91% 100%,9% 100%)}.title-card{position:relative;z-index:2;width:min(560px,94vw);padding:26px 22px;background:rgba(7,9,12,.76);border:1px solid rgba(255,255,255,.25);border-radius:18px;backdrop-filter:blur(8px);box-shadow:0 22px 60px rgba(0,0,0,.28)}.title h1{font-family:"Yu Mincho",serif;font-size:clamp(34px,8vw,58px);letter-spacing:.15em;margin:4px 0 8px}.subtitle{color:#cfd7dc;font-size:13px;letter-spacing:.08em}.title-actions{display:grid;gap:10px;margin-top:26px}.title-actions button{min-height:50px;border-radius:12px;border:1px solid #65707a;background:#161b20;color:white}.title-actions button.primary{background:#e8edf0;color:#11161a;border-color:#fff;font-weight:700}.title-actions button:disabled{opacity:.45}.notice{margin-top:15px;color:#9ea8b0;font-size:12px;line-height:1.6}
.panel{position:fixed;inset:0;z-index:30;background:rgba(4,6,9,.94);padding:18px;overflow:auto;display:none}.panel.open{display:block}.panel-card{max-width:800px;margin:25px auto;background:#11161c;border:1px solid #303840;border-radius:16px;padding:18px}.panel h2{font-family:"Yu Mincho",serif;letter-spacing:.06em}.panel button.close{float:right;border:1px solid #49515a;background:#1e252c;color:#fff;border-radius:10px;padding:9px 12px}.logitem{border-bottom:1px solid #252b31;padding:10px 0;color:#d4d9dd;line-height:1.7}.logitem b{color:#d9c99e}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #252b31}.settings-row input{width:52%}.ending-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.ending{padding:10px;border:1px solid #303840;border-radius:10px;color:#aeb7be}.ending.done{color:#f0f3f5;border-color:#68727c}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;background:rgba(15,19,24,.95);border:1px solid #424b54;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
@media(max-width:600px){.screen{min-height:54vh}.textbox{min-height:46vh;padding-left:14px;padding-right:14px}.text{font-size:16px;line-height:1.82;min-height:190px}.char{width:34%;height:68%}.char.left{left:-1%}.char.center{left:33%}.char.right{right:-1%}.hud{top:48px}.scene-label{max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media(prefers-reduced-motion:reduce){.snow{animation:none}.char{transition:none}}
</style>
</head>
<body>
<div id="app">
<section id="title" class="title">
  <div class="snow"></div>
  <div class="title-card">
    <div class="subtitle">一九九三年　二月　白嶺温泉</div>
    <h1>ゆきがくれの夜</h1>
    <div class="subtitle">雪待庵編　第一夜〜最初の死</div>
    <div class="title-actions">
      <button id="newGame" class="primary">はじめから</button>
      <button id="continueGame">つづきから</button>
      <button id="chapterSelect">章の最初から</button>
      <button id="openEndings">エンディング／到達記録</button>
    </div>
    <div class="notice">イヤホン推奨。最初のタップ後に音声が始まります。<br>セーブデータはこのブラウザに保存されます。</div>
  </div>
</section>
<section id="game" hidden>
  <div class="screen">
    <div id="bg" class="bg arrival"></div><div id="snow" class="snow"></div><div class="vignette"></div><div id="flash" class="flash"></div>
    <div id="sceneLabel" class="scene-label">白嶺温泉</div>
    <div class="characters">
      <div id="charL" class="char left female"><div class="head"></div><div class="body"></div><div class="leg1"></div><div class="leg2"></div></div>
      <div id="charC" class="char center"><div class="head"></div><div class="body"></div><div class="leg1"></div><div class="leg2"></div></div>
      <div id="charR" class="char right coat"><div class="head"></div><div class="body"></div><div class="leg1"></div><div class="leg2"></div></div>
    </div>
    <div class="hud">
      <button id="saveBtn">SAVE</button><button id="loadBtn">LOAD</button><button id="logBtn">LOG</button><button id="settingsBtn">設定</button>
    </div>
  </div>
  <div class="textbox">
    <div class="meta"><span id="chapter"></span><span id="time"></span></div>
    <div class="name" id="name"></div>
    <div class="text" id="text"></div>
    <div class="choices" id="choices"></div>
    <div class="tap" id="tapHint">画面をタップして進む</div>
  </div>
</section>
</div>
<div id="logPanel" class="panel"><div class="panel-card"><button class="close" data-close="logPanel">閉じる</button><h2>バックログ</h2><div id="logList"></div></div></div>
<div id="settingsPanel" class="panel"><div class="panel-card"><button class="close" data-close="settingsPanel">閉じる</button><h2>設定</h2><div class="settings-row"><span>BGM</span><input id="bgmVol" type="range" min="0" max="100" value="55"></div><div class="settings-row"><span>SE</span><input id="seVol" type="range" min="0" max="100" value="70"></div><div class="settings-row"><span>文字速度</span><input id="textSpeed" type="range" min="5" max="40" value="18"></div><div class="settings-row"><span>既読スキップ</span><button id="skipToggle">OFF</button></div><p style="color:#9ea8b0;font-size:12px;line-height:1.7">iPhoneでは消音スイッチや省電力設定によって音が小さくなる場合があります。最初の操作後に音声を開始します。</p></div></div>
<div id="endingPanel" class="panel"><div class="panel-card"><button class="close" data-close="endingPanel">閉じる</button><h2>到達記録</h2><div class="ending-grid" id="endingGrid"></div></div></div>
<div id="toast" class="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), title=$('#title'),game=$('#game'),bg=$('#bg'),snow=$('#snow'),label=$('#sceneLabel'),nameEl=$('#name'),textEl=$('#text'),choicesEl=$('#choices'),chapterEl=$('#chapter'),timeEl=$('#time'),tapHint=$('#tapHint'),flash=$('#flash');
const chars={L:$('#charL'),C:$('#charC'),R:$('#charR')};
let audioCtx=null,master=null,bgmGain=null,seGain=null,bgmNodes=[],typingTimer=null,skip=false,fastForward=false;
let state={scene:'prologue1',flags:{},aff:{maho:0,chiaki:0,morikawa:0,miki:0,aki:0},clues:0,fun:0,seen:{},log:[],endings:[]};
const SAVEKEY='yukigakure_ch1_save_v2',METAKEY='yukigakure_ch1_meta_v2';
function meta(){try{return JSON.parse(localStorage.getItem(METAKEY)||'{}')}catch{return {}}}function saveMeta(m){localStorage.setItem(METAKEY,JSON.stringify(m))}
function initAudio(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();bgmGain=audioCtx.createGain();seGain=audioCtx.createGain();master.gain.value=.75;bgmGain.gain.value=.55;seGain.gain.value=.7;bgmGain.connect(master);seGain.connect(master);master.connect(audioCtx.destination)}catch(e){}}
function stopBgm(){bgmNodes.forEach(n=>{try{n.stop()}catch{}});bgmNodes=[]}
function mood(kind){if(!audioCtx)return;stopBgm();const presets={snow:[[110,'sine',.055],[164.81,'triangle',.025],[220,'sine',.018]],warm:[[130.81,'sine',.04],[196,'triangle',.024],[261.63,'sine',.014]],play:[[146.83,'triangle',.035],[220,'sine',.018],[293.66,'triangle',.012]],uneasy:[[73.42,'sine',.07],[110,'triangle',.018],[146.83,'sine',.012]],night:[[55,'sine',.08],[82.41,'triangle',.018],[123.47,'sine',.01]]};(presets[kind]||presets.snow).forEach(([f,t,v],i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(bgmGain);o.start(audioCtx.currentTime+i*.05);bgmNodes.push(o)})}
function se(type='tap'){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();let f=420,d=.07,t='sine';if(type==='door'){f=145;d=.16;t='square'}if(type==='knock'){f=110;d=.11;t='square'}if(type==='pingpong'){f=620;d=.035;t='square'}if(type==='shogi'){f=260;d=.06;t='triangle'}if(type==='wind'){f=80;d=.4;t='sine'}o.type=t;o.frequency.value=f;g.gain.setValueAtTime(type==='wind'?.04:.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(seGain);o.start();o.stop(audioCtx.currentTime+d)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1200)}
function setChars(arr=[]){Object.values(chars).forEach(c=>c.classList.remove('show','female','coat','senior','short'));arr.forEach((x,i)=>{const c=chars[x.pos||['L','C','R'][i]];if(!c)return;c.classList.add('show');(x.cls||'').split(' ').filter(Boolean).forEach(k=>c.classList.add(k))})}
function applySceneStyle(s){bg.className='bg '+(s.bg||'arrival')+(s.night?' night':'');snow.classList.toggle('hidden',s.snow===false);label.textContent=s.place||'';chapterEl.textContent=s.chapter||'';timeEl.textContent=s.time||'';setChars(s.chars||[]);if(s.flash){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}if(s.mood)mood(s.mood)}
function addLog(s){const plain=s.text.replace(/<[^>]+>/g,'');state.log.push({name:s.name||'',text:plain});if(state.log.length>120)state.log.shift()}
function typeText(text,done){clearInterval(typingTimer);textEl.textContent='';let i=0;const speed=Math.max(4,45-(+$('#textSpeed').value));typingTimer=setInterval(()=>{i+=fastForward?4:1;textEl.textContent=text.slice(0,i);if(i>=text.length){clearInterval(typingTimer);typingTimer=null;done&&done()}},speed)}
function render(id,pushLog=true){const s=SCENES[id];if(!s)return;state.scene=id;state.seen[id]=true;applySceneStyle(s);nameEl.textContent=s.name||'';choicesEl.innerHTML='';tapHint.style.display=s.choices?'none':'flex';if(pushLog)addLog(s);typeText(s.text,()=>{if(s.auto) setTimeout(()=>go(s.auto),s.delay||450);if(s.choices){s.choices.forEach((c,idx)=>{const b=document.createElement('button');b.className='choice'+(c.subtle?' subtle':'');b.textContent=c.label;b.addEventListener('click',e=>{e.stopPropagation();initAudio();se(c.se||'tap');if(c.effect)c.effect();go(typeof c.next==='function'?c.next():c.next)});choicesEl.appendChild(b)})}});persistAuto()}
function go(id){fastForward=false;render(id,true)}
function advance(){const s=SCENES[state.scene];if(typingTimer){fastForward=true;return}if(!s||s.choices)return;if(s.next)go(typeof s.next==='function'?s.next():s.next)}
function persistAuto(){const m=meta();m.lastScene=state.scene;m.endings=Array.from(new Set([...(m.endings||[]),...(state.endings||[])]));saveMeta(m)}
function manualSave(){localStorage.setItem(SAVEKEY,JSON.stringify(state));toast('セーブしました')}
function manualLoad(){const raw=localStorage.getItem(SAVEKEY);if(!raw){toast('セーブデータがありません');return}try{state=JSON.parse(raw);title.hidden=true;game.hidden=false;render(state.scene,false);toast('ロードしました')}catch{toast('ロードに失敗しました')}}
function showTitle(){stopBgm();game.hidden=true;title.hidden=false;$('#continueGame').disabled=!localStorage.getItem(SAVEKEY)}
function openLog(){const list=$('#logList');list.innerHTML='';state.log.slice().reverse().forEach(x=>{const d=document.createElement('div');d.className='logitem';d.innerHTML=(x.name?'<b>'+escapeHtml(x.name)+'</b><br>':'')+escapeHtml(x.text).replace(/\n/g,'<br>');list.appendChild(d)});$('#logPanel').classList.add('open')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ending(name,text){state.endings=Array.from(new Set([...(state.endings||[]),name]));const m=meta();m.endings=Array.from(new Set([...(m.endings||[]),name]));saveMeta(m);const id='end_'+name;SCENES[id]={chapter:'到達記録',time:'',place:'',bg:'night',night:true,snow:true,mood:'night',name:'',text:text+'\n\n―― '+name+' ――',choices:[{label:'タイトルへ戻る',next:()=>{showTitle();return 'noop'}},{label:'直前の分岐へ戻る',next:state.flags.lastBranch||'roomNight'}]};render(id);}
function showEndings(){const m=meta(),got=new Set(m.endings||[]),grid=$('#endingGrid');grid.innerHTML='';['第一夜・終','第一の死','雪だるま大将','雪山の名探偵','卓球王','飲みすぎ','好奇心は猫を','誰かいる'].forEach((e,i)=>{const d=document.createElement('div');d.className='ending'+(got.has(e)?' done':'');d.textContent=String(i+1).padStart(2,'0')+'　'+(got.has(e)?e:'？？？？');grid.appendChild(d)});$('#endingPanel').classList.add('open')}

const SCENES={
prologue1:{chapter:'序章',time:'16:56',place:'白嶺温泉・バス停',bg:'arrival',mood:'snow',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'coat'}],text:'バスが、雪煙を巻き上げながら坂の向こうへ消えていった。\n\n残されたのは、僕と真帆、それから山ほどの荷物。\n\nさっきまで車内で聞こえていたエンジン音がなくなると、世界は驚くほど静かになった。\n\n雪が音を吸っている。\n\n「……ほんとにここ？」\n\n真帆が、白く息を吐きながら僕を見る。',next:'prologue2'},
prologue2:{chapter:'序章',time:'16:57',place:'白嶺温泉・バス停',bg:'arrival',mood:'snow',name:'透司',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'coat'}],text:'「地図だと、ここから歩いて五分」\n\n僕は旅行雑誌の切り抜きを広げた。\n\n《白嶺温泉　雪待庵――雪深い山里にひっそり建つ、全十室の小さな湯宿》\n\nページの写真は、今よりずっと晴れている。\n\n目の前は真っ白だった。',choices:[{label:'「この程度の雪、余裕だろ」',next:'walkBrave',effect:()=>state.flags.brave=true},{label:'「五分って、雪道の五分じゃないよな……」',next:'walkNormal'},{label:'真帆の荷物を黙って持つ',next:'walkKind',effect:()=>state.aff.maho++}]},
walkBrave:{chapter:'序章',time:'17:05',place:'雪道',bg:'arrival',mood:'snow',chars:[{pos:'C',cls:'coat'}],text:'三分後。\n\n僕はすでに後悔していた。\n\n膝まで埋まる場所がある。風は正面から吹く。雪は靴の隙間から容赦なく入る。\n\n後ろから真帆の声。\n\n「余裕なんだよね？」\n\n振り返ると、ものすごく楽しそうだった。',next:'innArrival'},
walkNormal:{chapter:'序章',time:'17:04',place:'雪道',bg:'arrival',mood:'snow',chars:[{pos:'C',cls:'coat'}],text:'雪道は、普通の道の倍くらい時間がかかった。\n\n「こういう時の五分って信用ならないよね」\n\n真帆が僕の足跡をなぞるように歩いてくる。\n\n「旅行雑誌に『悪天候時は十二分』って書かれてても行きたくならないだろ」\n\n「それはそう」',next:'innArrival'},
walkKind:{chapter:'序章',time:'17:03',place:'雪道',bg:'arrival',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'coat'}],name:'真帆',text:'「……ありがと」\n\nいつもなら『いいよ、自分で持てる』と言いそうなのに、今日は素直だった。\n\nその一言だけで、急に来てよかった気がする。\n\n僕は単純だ。',next:'innArrival'},
innArrival:{chapter:'第一章　雪待庵',time:'17:11',place:'雪待庵・玄関',bg:'arrival',mood:'warm',chars:[{pos:'C',cls:'senior coat'}],text:'雪の向こうに、ようやく建物が見えた。\n\n木造二階建て。思っていたより大きい。けれどホテルという感じではなく、どこか人の家に近い。\n\n軒先には小さな提灯。\n\n《雪待庵》\n\n引き戸を開けると、湯気のような暖気と木の匂いが流れ出してきた。',next:'ownerWelcome'},
ownerWelcome:{chapter:'第一章　雪待庵',time:'17:13',place:'雪待庵・玄関',bg:'lobby',mood:'warm',chars:[{pos:'C',cls:'senior coat'}],name:'香月 重蔵',text:'「……三浦さんと、水野さん？」\n\n低い声。\n\n五十代後半くらいの男が、僕らを見ていた。\n\n愛想笑いはない。\n\n「はい」\n\n「遠かったでしょう」\n\n言い方はぶっきらぼうなのに、僕の濡れた鞄を先に受け取る。\n\nこの人が主人の香月重蔵らしい。',next:'landladyWelcome'},
landladyWelcome:{chapter:'第一章　雪待庵',time:'17:15',place:'雪待庵・玄関',bg:'lobby',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],name:'香月 啓子',text:'「まあまあ、こんなに雪まみれになって。早く上がってください」\n\n奥から現れた女将の啓子さんは、夫とは正反対だった。\n\nさらにその後ろから、若い女性が顔を出す。\n\n「千秋、タオルお願い」\n\n「はーい」\n\n娘の千秋さん。僕たちより少し年上だろう。',choices:[{label:'千秋に会釈する',next:'roomIntro',effect:()=>state.aff.chiaki++},{label:'まず真帆にタオルを渡す',next:'roomIntro',effect:()=>state.aff.maho++},{label:'自分の頭を犬みたいに振って雪を落とす',next:'shakeSnow',effect:()=>state.fun++}]},
shakeSnow:{chapter:'第一章　雪待庵',time:'17:16',place:'雪待庵・玄関',bg:'lobby',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],name:'真帆',text:'「ちょっと！　飛ぶ！」\n\n千秋さんが吹き出した。\n\n「元気ですね、彼氏さん」\n\n「違います」\n\n僕と真帆の声が、見事に重なった。\n\n今度は啓子さんまで笑った。',next:'roomIntro'},
roomIntro:{chapter:'第一章　雪待庵',time:'17:28',place:'二階・楓の間',bg:'room',mood:'warm',chars:[{pos:'L',cls:'female'}],text:'僕たちの部屋は二階の《楓の間》だった。\n\n八畳の和室。窓の外には雪をかぶった杉林。\n\n暖房の効いた部屋へ入った途端、真帆が畳に倒れ込んだ。\n\n「生き返る……」\n\n僕も同感だった。\n\nテーブルの上には急須と小さな饅頭が二つ。\n\nそれから、まだ敷かれていない布団が二組。',choices:[{label:'「布団、くっつけて敷いてもらう？」',next:'futonJoke',effect:()=>state.aff.maho++},{label:'窓から外を見る',next:'windowTalk'},{label:'饅頭を先に食べる',next:'manju'}]},
futonJoke:{chapter:'第一章　雪待庵',time:'17:29',place:'二階・楓の間',bg:'room',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「……どういう意味？」\n\n「いや、寒いし」\n\n「旅館って、布団の間隔も暖房で調整するんだ」\n\n「そういう伝統が」\n\n「ない」\n\n秒で切られた。\n\nでも真帆は怒っていない。口元が少し笑っている。',next:'freeTime'},
windowTalk:{chapter:'第一章　雪待庵',time:'17:30',place:'二階・楓の間',bg:'room',mood:'snow',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「すごいね」\n\n窓の外は、道も川もほとんど白く消えていた。\n\n「明日、帰れるのかな」\n\n「朝には除雪されるって」\n\n「ならいいけど」\n\n真帆はそう言いながら、しばらく外を見ていた。',next:'freeTime'},
manju:{chapter:'第一章　雪待庵',time:'17:29',place:'二階・楓の間',bg:'room',mood:'warm',name:'真帆',chars:[{pos:'L',cls:'female'}],text:'「あ、それ私の」\n\n「同じだろ」\n\n「そっちの方がちょっと大きい」\n\n確かに、ほんの少しだけ大きい。\n\n交換した。\n\n「よろしい」\n\n旅行開始二十分で、僕の立場はだいたい決まった。',next:'freeTime'},
freeTime:{chapter:'第一章　雪待庵',time:'17:41',place:'雪待庵',bg:'lobby',mood:'warm',text:'夕食は六時半。\n\n少し時間がある。\n\n部屋に置かれた館内案内には、浴場、談話室、遊技場、喫煙室。\n\n小さな旅館にしては、意外と居場所が多い。',choices:[{label:'談話室へ行く',next:'loungeMeet'},{label:'遊技場を見に行く',next:'gameRoomMeet'},{label:'館内をぶらつく',next:'hallMeet'}]},
loungeMeet:{chapter:'第二章　宿泊客たち',time:'17:47',place:'一階・談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'coat'}],text:'談話室には、先客が二人いた。\n\nソファで雑誌を読んでいる女性。\nその向かいで、コーヒーを飲みながら新聞を広げた男。\n\n僕らが入ると、男の方が先に顔を上げた。',next:'morikawaIntro'},
morikawaIntro:{chapter:'第二章　宿泊客たち',time:'17:48',place:'一階・談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'coat'}],name:'森川 俊夫',text:'「若いねえ。学生さん？」\n\n初対面なのに距離が近い。\n\n森川俊夫。三十一歳。東京の雑誌編集者だという。\n\n「仕事で地方の宿を回ってるんですか？」\n\n僕が聞くと、森川さんは笑った。\n\n「いやいや。今回は完全に休み。原稿もカメラも持ってきてない。何にも仕事しない旅」\n\nそう言って、新聞を畳んだ。',choices:[{label:'「編集者って、旅行中もネタ探ししそうですけど」',next:'morikawaTalk',effect:()=>state.aff.morikawa++},{label:'雑誌の仕事について聞く',next:'morikawaTalk2'},{label:'女性の方に話しかける',next:'kanakoIntro'}]},
morikawaTalk:{chapter:'第二章　宿泊客たち',time:'17:50',place:'一階・談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'coat'}],name:'森川 俊夫',text:'「分かってないなあ。編集者は休む時は徹底的に休むの」\n\n言いながら、テーブルに置かれた旅館のパンフレットを手に取る。\n\n「でも、こういう古い宿の印刷物は好き。紙の匂いとか、字体とか」\n\n職業病じゃないか、と言いかけてやめた。',next:'kanakoIntro'},
morikawaTalk2:{chapter:'第二章　宿泊客たち',time:'17:50',place:'一階・談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'coat'}],name:'森川 俊夫',text:'「記事ってのはね、事実より『どう見せるか』で読まれ方が変わるんだよ」\n\n森川さんは軽い調子で言った。\n\n「同じ写真でも、見出し一つで犯人にも被害者にも見える」\n\n横で女性が雑誌から目を上げる。\n\n「怖い仕事ですね」\n\n「怖い怖い。だから休暇中は善良な一般人」',next:'kanakoIntro'},
kanakoIntro:{chapter:'第二章　宿泊客たち',time:'17:52',place:'一階・談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'coat'}],name:'杉浦 可奈子',text:'女性は杉浦可奈子。二十六歳。看護師。\n\n「夜勤明けでそのまま来たので、眠くて」\n\n落ち着いた声。\n\n真帆が「大変そう」と言うと、可奈子さんは少し笑った。\n\n「病院より旅館の方が静かですから」\n\nその言い方が妙に実感がこもっていた。',next:'dinnerCall'},
gameRoomMeet:{chapter:'第二章　宿泊客たち',time:'17:46',place:'一階・遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'coat short'},{pos:'R',cls:'female short'}],text:'遊技場には、卓球台と将棋盤、それに古いゲーム機が一台。\n\n若い男がしゃがみ込んで、卓球台の下を覗いていた。\n\n「落とした？」\n\n声をかけると、男は慌てて立ち上がった。',next:'mikiIntro'},
mikiIntro:{chapter:'第二章　宿泊客たち',time:'17:47',place:'一階・遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'coat short'},{pos:'R',cls:'female short'}],name:'三木 隆志',text:'「フィルムケース。転がしちゃって」\n\n三木隆志。二十三歳。大学院生。\n\n首からカメラを下げている。\n\n「デジカメじゃないんですね」\n\n「フィルムの方が、撮ったあと待つ時間が好きなんです」\n\n妙に嬉しそうに言った。\n\n足元に黒い小さなケースが転がっている。',choices:[{label:'拾って渡す',next:'mikiThanks',effect:()=>{state.aff.miki++;state.clues++}},{label:'足で止める',next:'mikiThanks'},{label:'「中身、入ってます？」',next:'filmTalk'}]},
mikiThanks:{chapter:'第二章　宿泊客たち',time:'17:48',place:'一階・遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'coat short'},{pos:'R',cls:'female short'}],name:'三木 隆志',text:'「ありがとう。これ、似たようなのばっかりで分からなくなるんですよね」\n\n三木はケースをポケットへ入れた。\n\nその横で、もう一人の女性が卓球ラケットを振っている。\n\n「ねえ、学生さん。あとでやらない？」\n\n真島亜希。二十二歳。明るくて、初対面とは思えない調子だった。',next:'akiIntro'},
filmTalk:{chapter:'第二章　宿泊客たち',time:'17:48',place:'一階・遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'coat short'}],name:'三木 隆志',text:'「たぶん未使用。……いや、撮影済みかな」\n\n「分からないんですか」\n\n「同じケースに入れてると、たまに」\n\n真帆が横から言う。\n\n「それ、写真好きとして致命的じゃない？」\n\n三木は頭をかいた。',next:'akiIntro'},
akiIntro:{chapter:'第二章　宿泊客たち',time:'17:50',place:'一階・遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'female'}],name:'真島 亜希',text:'「私、学生の時ずっと卓球部だったから」\n\n亜希さんはラケットをくるりと回す。\n\n「うそ。今考えた」\n\n真帆が笑った。\n\n「この人、こういうことばっか言うんですよ」\n\n三木が慣れた様子で補足する。\n\n二人はここで知り合ったらしい。',next:'dinnerCall'},
hallMeet:{chapter:'第二章　宿泊客たち',time:'17:45',place:'二階廊下',bg:'corridor',mood:'warm',chars:[{pos:'C',cls:'senior coat'}],text:'古い旅館特有の、少し沈む廊下。\n\n突き当たりの窓から雪が見える。\n\n曲がり角で、一人の老人と鉢合わせた。',next:'shinoIntro'},
shinoIntro:{chapter:'第二章　宿泊客たち',time:'17:46',place:'二階廊下',bg:'corridor',mood:'warm',chars:[{pos:'C',cls:'senior coat'}],name:'篠崎 正一',text:'「おっと、失礼」\n\n篠崎正一。六十七歳。元教師。\n\n「若い人がいると宿が明るくなるね」\n\n柔らかい声だった。\n\n「先生だったんですか？」\n\n「四十年ほど。今でも人を見ると、つい『ちゃんと挨拶できるかな』と思ってしまう」\n\n真帆がすぐに背筋を伸ばした。',next:'kurodaIntro'},
kurodaIntro:{chapter:'第二章　宿泊客たち',time:'17:49',place:'二階廊下',bg:'corridor',mood:'warm',chars:[{pos:'R',cls:'coat'}],text:'そのあと階段で、無口そうな男とすれ違った。\n\n向こうから軽く会釈。\n\n名札などはない。\n\n後で聞いたところでは、黒田和也、四十二歳。会社員。\n\nそれ以上のことは、誰もあまり知らなかった。',next:'dinnerCall'},
dinnerCall:{chapter:'第三章　十一人',time:'18:27',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'六時半。\n\n食堂には、宿泊客と旅館の家族が全員そろった。\n\n僕、真帆、森川、三木、亜希、可奈子、黒田、篠崎。\nそして重蔵さん、啓子さん、千秋さん。\n\n十一人。\n\n鍋の湯気の向こうで、知らない者同士だった空気が少しずつほぐれていった。',next:'dinnerBanters'},
dinnerBanters:{chapter:'第三章　十一人',time:'18:35',place:'食堂',bg:'dining',mood:'warm',name:'森川 俊夫',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'「で、君たちは付き合って何年？」\n\n森川さんが鍋をよそいながら、いきなり聞いた。\n\n真帆の箸が止まる。\n\n「付き合ってません」\n\nまた声が重なった。\n\n亜希さんが笑う。\n\n「息ぴったりじゃん」',choices:[{label:'「まだ、です」',next:'dinnerStill',effect:()=>state.aff.maho++},{label:'「ただの友達です」',next:'dinnerFriend'},{label:'「本人の前で聞かないでください」',next:'dinnerDeflect'}]},
dinnerStill:{chapter:'第三章　十一人',time:'18:36',place:'食堂',bg:'dining',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],name:'真帆',text:'「“まだ”って何」\n\n真帆は僕を睨む。\n\n千秋さんが味噌汁を運びながら、ものすごく楽しそうな顔をした。\n\n「若いっていいですねえ」\n\n「千秋さんも若いでしょ」\n\n「旅館の娘は若いうちから現実見ますから」\n\n重蔵さんが一瞬だけ娘を見る。\n\n千秋さんは気づかないふりをした。',next:'dinnerWork'},
dinnerFriend:{chapter:'第三章　十一人',time:'18:36',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「ただの、って言い方は何か腹立つ」\n\n「え？」\n\n「なんでもない」\n\n僕には女心が分からない。\n\n篠崎先生が静かに笑っていた。',next:'dinnerWork'},
dinnerDeflect:{chapter:'第三章　十一人',time:'18:36',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「はいはい。失礼しました」\n\n森川さんは笑いながら引いた。\n\nその引き際が妙に上手い。\n\n人に話させる仕事をしている人間は、距離の詰め方も引き方も知っているのかもしれない。',next:'dinnerWork'},
dinnerWork:{chapter:'第三章　十一人',time:'18:49',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'coat'},{pos:'C',cls:'female short'},{pos:'R',cls:'coat short'}],text:'話題は仕事や学校のことに移った。\n\n森川さんは「休暇中だから仕事の話はしない」と言いながら、結局一番よく喋った。\n可奈子さんは救急外来の話を少しだけ。\n三木は研究より写真の話の方が長い。\n亜希さんは会社の愚痴を笑い話に変える。\n\n黒田さんだけは、必要な時に相槌を打つ程度だった。',choices:[{label:'黒田さんに話を振る',next:'kurodaDinner'},{label:'三木のカメラを見せてもらう',next:'cameraDinner',effect:()=>state.aff.miki++},{label:'千秋さんに旅館のことを聞く',next:'chiakiDinner',effect:()=>state.aff.chiaki++}]},
kurodaDinner:{chapter:'第三章　十一人',time:'18:53',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'C',cls:'coat'}],name:'黒田 和也',text:'「仕事ですか。普通の会社員ですよ」\n\nそれだけ。\n\n森川さんが「一番怪しい答えだな」と茶化すと、黒田さんは初めて少し笑った。\n\n「森川さんほど話すことがないだけです」\n\n「それは俺が喋りすぎってこと？」\n\n「たぶん」\n\n食卓に笑いが起きた。',next:'afterDinnerChoice'},
cameraDinner:{chapter:'第三章　十一人',time:'18:52',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'C',cls:'coat short'}],name:'三木 隆志',text:'「これ、古いけど気に入ってて」\n\n三木はカメラを大事そうに持つ。\n\nテーブルの端に、黒いフィルムケースが三つ。\n\n亜希さんが一つつまんだ。\n\n「どれが今日撮ったやつ？」\n\n「えーと……たぶん、それじゃない方」\n\n「管理雑すぎない？」\n\n森川さんまで一つ手に取って笑った。\n\n三木は慌てて全部まとめてポケットへ戻した。',next:'afterDinnerChoice'},
chiakiDinner:{chapter:'第三章　十一人',time:'18:54',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'C',cls:'female short'}],name:'香月 千秋',text:'「この旅館？　祖父の代から。私は……まあ、手伝ってるだけ」\n\n「継ぐんですか？」\n\n一瞬だけ間があった。\n\n「さあ」\n\n向こうで重蔵さんが食器を運んでいる。\n\n「お父さんは継いでほしいんじゃ？」\n\n「本人に聞いて」\n\n笑っているけれど、その話題だけ少し温度が低かった。',next:'afterDinnerChoice'},
afterDinnerChoice:{chapter:'第四章　長い夜の始まり',time:'19:32',place:'雪待庵',bg:'lounge',mood:'warm',text:'夕食が終わっても、誰もすぐには部屋へ戻らなかった。\n\n外は吹雪。\nテレビは映りが悪い。\n電話も、さっきから雑音がひどいらしい。\n\n自然と、みんな同じ場所に集まっていた。',choices:[{label:'卓球をする',next:'pingpong1'},{label:'将棋を見る',next:'shogi1'},{label:'談話室でお茶を飲む',next:'tea1'}]},
pingpong1:{chapter:'第四章　長い夜の始まり',time:'19:38',place:'遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],name:'真島 亜希',text:'「負けた人、明日の朝いちばんに雪かきね！」\n\n「勝手に決めないで」\n\n真帆が笑う。\n\n卓球は意外なほど盛り上がった。\n三木は見た目より上手い。千秋さんは本気で強い。森川さんは口だけ。\n\nそして真帆は、スマッシュのたびに人格が変わった。',choices:[{label:'真帆と組む',next:'pingpongMaho',effect:()=>state.aff.maho++},{label:'千秋さんに挑む',next:'pingpongChiaki',effect:()=>state.aff.chiaki++},{label:'森川さんを狙い撃ちする',next:'pingpongMori',effect:()=>state.fun++}]},
pingpongMaho:{chapter:'第四章　長い夜の始まり',time:'19:52',place:'遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'coat'}],name:'真帆',text:'「そこ！　取って！」\n\n「無理！」\n\n「諦めるの早い！」\n\n完全に部活だった。\n\nでも、ポイントを取るたびに真帆が笑う。\n\n旅行に誘ってよかった。\n\nそう思った。',next:'bagMissing'},
pingpongChiaki:{chapter:'第四章　長い夜の始まり',time:'19:51',place:'遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'coat'}],name:'香月 千秋',text:'「旅館の娘なめない方がいいよ」\n\nスマッシュ。\n\n僕の横を球が抜けた。\n\n「なんで旅館の娘が卓球強いんですか」\n\n「暇だから」\n\n身も蓋もない。\n\n真帆が腹を抱えて笑っている。',next:'bagMissing'},
pingpongMori:{chapter:'第四章　長い夜の始まり',time:'19:50',place:'遊技場',bg:'gameroom',mood:'play',chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「ちょ、若者が大人をいじめるな！」\n\n「編集者は休暇中なんですよね」\n\n「そういう伏線回収いらない！」\n\n亜希さんが笑いすぎてラケットを落とした。',next:'bagMissing'},
shogi1:{chapter:'第四章　長い夜の始まり',time:'19:40',place:'遊技場',bg:'gameroom',mood:'warm',chars:[{pos:'L',cls:'senior coat'},{pos:'R',cls:'coat'}],name:'篠崎 正一',text:'「将棋、指せる？」\n\n篠崎先生と黒田さんが盤を囲んでいる。\n\n黒田さんはあまり喋らないが、駒を持つ手は迷わない。\n\n「昔、父に少し」\n\n僕が答えると、篠崎先生は嬉しそうに席をずらした。',choices:[{label:'篠崎先生に教わる',next:'shogiTalk'},{label:'黒田さんの指し手を見る',next:'kurodaShogi',effect:()=>state.clues++},{label:'駒の形だけ眺める',next:'bagMissing'}]},
shogiTalk:{chapter:'第四章　長い夜の始まり',time:'19:55',place:'遊技場',bg:'gameroom',mood:'warm',chars:[{pos:'C',cls:'senior coat'}],name:'篠崎 正一',text:'「人はね、勝とうとすると駒しか見えなくなる」\n\n篠崎先生が桂馬をつまむ。\n\n「でも本当は、盤全体を見ないといけない」\n\n教師っぽい言い方だ。\n\n「人生の話ですか？」\n\n「将棋の話」\n\n笑われた。',next:'bagMissing'},
kurodaShogi:{chapter:'第四章　長い夜の始まり',time:'19:54',place:'遊技場',bg:'gameroom',mood:'warm',chars:[{pos:'C',cls:'coat'}],name:'黒田 和也',text:'黒田さんは、一度だけ盤外に落ちた桂馬を拾った。\n\nその時、右手ではなく左手を使った。\n\nただそれだけ。\n\n気にするほどのことではない。\n\n――その時は、そう思った。',next:'bagMissing'},
tea1:{chapter:'第四章　長い夜の始まり',time:'19:39',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'female'}],name:'杉浦 可奈子',text:'「こういう何もしない時間、久しぶり」\n\n可奈子さんは湯呑みを両手で包んでいた。\n\n亜希さんが窓に張りついている。\n\n「すごいよ。道路、完全に消えてる」\n\n真帆も隣へ行く。\n\n外は白一色だった。',choices:[{label:'可奈子さんの仕事の話を聞く',next:'kanakoTalk'},{label:'亜希さんと窓を見る',next:'akiWindow',effect:()=>state.aff.aki++},{label:'森川さんの新聞を覗く',next:'paperTalk',effect:()=>state.clues++}]},
kanakoTalk:{chapter:'第四章　長い夜の始まり',time:'19:47',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'C',cls:'female short'}],name:'杉浦 可奈子',text:'「人って、普段は大丈夫そうに見えても突然倒れるから」\n\n可奈子さんは淡々と言った。\n\n「旅行中くらい病院のこと忘れたいんだけどね」\n\nそう言って笑う。\n\nでもその目だけ、少し疲れて見えた。',next:'bagMissing'},
akiWindow:{chapter:'第四章　長い夜の始まり',time:'19:47',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'}],name:'真島 亜希',text:'「明日、会社休めるかな」\n\n「休めるんじゃないですか。これなら」\n\n「最高」\n\n即答だった。\n\n「でも、月曜までには帰りたいな」\n\n亜希さんは何気なく言った。\n\n「人に渡すものがあるから」\n\n「仕事？」\n\n「まあ、そんな感じ」\n\nすぐ話題は変わった。',next:'bagMissing'},
paperTalk:{chapter:'第四章　長い夜の始まり',time:'19:46',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'森川さんが読んでいた地方紙の社会面に、企業の不正経理の記事が小さく載っていた。\n\n「こういうの、東京じゃ小さく扱われるんですよ」\n\n「詳しいんですね」\n\n「編集者だからね」\n\n言ってから、森川さんは新聞を折り畳んだ。',next:'bagMissing'},
bagMissing:{chapter:'第四章　長い夜の始まり',time:'20:08',place:'遊技場前',bg:'corridor',mood:'uneasy',name:'真島 亜希',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'female'}],text:'「あれ？」\n\n亜希さんが急に立ち止まった。\n\n「私の鞄、知らない？」\n\nさっきまで談話室の椅子に置いていたという。\n\n全員で探すほどでもない。\nそう言いながら、なぜかみんな少しだけ気にした。',choices:[{label:'一緒に探す',next:'bagSearch',effect:()=>state.clues++},{label:'「部屋じゃないですか？」',next:'bagFound'},{label:'「森川さんが隠したとか」',next:'bagJoke',effect:()=>state.fun++}]},
bagSearch:{chapter:'第四章　長い夜の始まり',time:'20:13',place:'一階廊下',bg:'corridor',mood:'uneasy',chars:[{pos:'L',cls:'female short'}],text:'鞄は、談話室から少し離れた廊下の隅にあった。\n\n「こんなところ置いたっけ」\n\n亜希さんが首をかしげる。\n\n中身を確認する。財布、化粧ポーチ、小さな手帳。\n\n「何もなくなってない」\n\nただ、ファスナーが半分ほど開いていた。',next:'bagAfter'},
bagFound:{chapter:'第四章　長い夜の始まり',time:'20:11',place:'一階廊下',bg:'corridor',mood:'uneasy',chars:[{pos:'L',cls:'female short'}],text:'「それが部屋にもなくて」\n\n結局、鞄は廊下の隅で見つかった。\n\n誰かが移動させたのか。\n亜希さんが自分で置いたのを忘れたのか。\n\n中身は無事。\nただ、ファスナーだけが少し開いていた。',next:'bagAfter'},
bagJoke:{chapter:'第四章　長い夜の始まり',time:'20:10',place:'遊技場前',bg:'corridor',mood:'play',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'coat'}],name:'森川 俊夫',text:'「なんで俺なんだよ！」\n\n「一番やりそうだから」\n\n亜希さんまで乗っかる。\n\n「ひどい宿泊客だな君たち」\n\n笑いながら探し始め、鞄は廊下の隅で見つかった。\n\nファスナーが少し開いていた。',next:'bagAfter'},
bagAfter:{chapter:'第四章　長い夜の始まり',time:'20:17',place:'一階廊下',bg:'corridor',mood:'uneasy',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'female'}],name:'真帆',text:'「誰か、中見たのかな」\n\n真帆が小声で言った。\n\n「まさか」\n\n「だよね」\n\nそれで話は終わった。\n\n終わったはずだった。',next:'phoneNoise'},
phoneNoise:{chapter:'第四章　長い夜の始まり',time:'20:31',place:'帳場前',bg:'lobby',mood:'uneasy',chars:[{pos:'C',cls:'senior coat'}],name:'香月 重蔵',text:'ジジッ。\n\n帳場の奥から、嫌な雑音が聞こえた。\n\n重蔵さんが受話器を置く。\n\n「駄目だな」\n\n「電話ですか？」\n\n「さっきから繋がったり切れたりだ。雪のせいだろう」\n\n携帯電話を持っている客はいない。\n一九九三年なら、それも珍しくなかった。',next:'lateFun'},
lateFun:{chapter:'第五章　夜の遊技場',time:'21:02',place:'遊技場',bg:'gameroom',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat short'},{pos:'R',cls:'female short'}],text:'電話のことも、鞄のことも、二十分もすると話題から消えた。\n\n遊技場では再び笑い声。\n\n三木がカメラを構え、亜希さんがピース。\n千秋さんが「撮るなら全員で」と人を集める。\n\n結局、旅館にいた十一人全員で一枚撮ることになった。',next:'groupPhoto'},
groupPhoto:{chapter:'第五章　夜の遊技場',time:'21:07',place:'遊技場',bg:'gameroom',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'C',cls:'coat'},{pos:'R',cls:'female'}],name:'三木 隆志',text:'「十秒！」\n\n三木がセルフタイマーを押して走ってくる。\n\n篠崎先生が「もっと寄って」と手招き。\n黒田さんが少し困った顔で端に立つ。\n森川さんが真帆と僕の肩を勝手に近づける。\n\nパシャ。\n\nフラッシュが白く弾けた。',next:'photoAfter',flash:true},
photoAfter:{chapter:'第五章　夜の遊技場',time:'21:08',place:'遊技場',bg:'gameroom',mood:'warm',chars:[{pos:'C',cls:'coat short'}],name:'三木 隆志',text:'「現像したら送りますよ」\n\n「住所、みんなに聞いといてね」\n\n亜希さんが言う。\n\n三木はフィルムを巻き上げる。\n\nカチ、カチ。\n\nその小さな音を、なぜか僕はよく覚えている。',next:'drinks'},
drinks:{chapter:'第五章　夜の遊技場',time:'21:22',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'coat'},{pos:'R',cls:'female short'}],text:'啓子さんが日本酒を少しだけ出してくれた。\n\n飲める大人だけ。\n\n僕と真帆はジュース。\n\n森川さんは「休暇だから」と二杯目。\n黒田さんは一杯でやめた。\n可奈子さんは最初から飲まない。\n\n人柄が出る。',choices:[{label:'森川さんの昔話を聞く',next:'moriPast'},{label:'真帆と少し離れて話す',next:'mahoQuiet',effect:()=>state.aff.maho++},{label:'亜希さんと三木の写真を見る',next:'photoTalk2',effect:()=>state.clues++}]},
moriPast:{chapter:'第五章　夜の遊技場',time:'21:31',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「昔は事件記事もやってたよ」\n\n森川さんは湯呑みを回す。\n\n「人間、追い詰められると面白いくらい普段と違うことする」\n\n「怖いこと言いますね」\n\n「だから今は旅行記事。温泉と飯の方が平和」\n\n笑っている。\n\nでも、なぜかその言葉だけ少し耳に残った。',next:'emptyGameNoise'},
mahoQuiet:{chapter:'第五章　夜の遊技場',time:'21:30',place:'談話室・窓際',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「楽しいね」\n\n「意外？」\n\n「知らない人ばっかりだから、最初はちょっと嫌だった」\n\n真帆は窓の外を見る。\n\n「でも、明日みんなで雪かきとかしたら、もっと仲良くなれそう」\n\n明日。\n\nその言葉を聞いた時、僕はごく普通に明日が来ると思っていた。',next:'emptyGameNoise'},
photoTalk2:{chapter:'第五章　夜の遊技場',time:'21:33',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'coat short'},{pos:'R',cls:'female short'}],name:'真島 亜希',text:'「これ、さっき拾ったやつ三木くんの？」\n\n亜希さんがテーブルの端にあった黒いケースを持ち上げる。\n\n三木は一瞬見てから、受け取った。\n\n「たぶん。俺のだと思う」\n\n「“たぶん”ばっかりだね」\n\n「ごめん」\n\n森川さんが横からケースを指で弾く。\n\n「名前書いとけよ、写真家」\n\n「写真家じゃないですって」',next:'emptyGameNoise'},
emptyGameNoise:{chapter:'第六章　小さな違和感',time:'22:07',place:'談話室',bg:'lounge',mood:'uneasy',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'coat'}],text:'カタン。\n\n廊下の向こうから、何かが落ちる音がした。\n\n会話が一瞬止まる。\n\n音がしたのは遊技場の方。\n\nさっきまで全員ここにいた。\n\n――少なくとも、僕はそう思った。',choices:[{label:'遊技場を見に行く',next:'checkGameRoom',effect:()=>state.clues++},{label:'「建物が鳴っただけでは？」',next:'ignoreNoise'},{label:'怖いので真帆を盾にする',next:'mahoShield',effect:()=>state.fun++}]},
checkGameRoom:{chapter:'第六章　小さな違和感',time:'22:09',place:'遊技場',bg:'gameroom',mood:'uneasy',chars:[],text:'電気をつける。\n\n誰もいない。\n\n卓球台。将棋盤。古いゲーム機。\n\n床に、将棋の桂馬が一枚落ちていた。\n\nさっき篠崎先生たちが指していた盤の駒だろう。\n\n窓は閉まっている。\n\nただの偶然。\n\nそう考えるのが自然だった。',choices:[{label:'桂馬を盤に戻す',next:'noiseAfter',effect:()=>state.clues++},{label:'そのままにする',next:'noiseAfter'}]},
ignoreNoise:{chapter:'第六章　小さな違和感',time:'22:08',place:'談話室',bg:'lounge',mood:'uneasy',name:'篠崎 正一',chars:[{pos:'C',cls:'senior coat'}],text:'「古い家はね、よく鳴るんですよ」\n\n篠崎先生が言う。\n\n重蔵さんも「ああ」とだけ答えた。\n\nそれで会話は戻った。\n\nでも三木だけは一度、遊技場の方を振り返っていた。',next:'noiseAfter'},
mahoShield:{chapter:'第六章　小さな違和感',time:'22:08',place:'談話室',bg:'lounge',mood:'play',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「なんで私を前に出すの」\n\n「こういう時は勇気ある人が」\n\n「じゃあ透司が行って」\n\n正論だった。',next:'checkGameRoom'},
noiseAfter:{chapter:'第六章　小さな違和感',time:'22:19',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'coat short'}],text:'戻ると、話題はすでに別のものになっていた。\n\n亜希さんが「明日、雪だるま作ろう」と言い、三木が写真を撮ると言う。\n\n森川さんは「記事にしないなら」とまた冗談。\n\nさっきの物音を気にしているのは、僕だけのようだった。',next:'bathChoice'},
bathChoice:{chapter:'第六章　小さな違和感',time:'22:34',place:'二階廊下',bg:'corridor',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「お風呂行ってくる」\n\n「一緒に？」\n\n「男女別」\n\n当然だった。\n\n「じゃ、あとで部屋で」\n\n真帆がタオルを抱えて階段を下りていく。',choices:[{label:'自分も風呂へ行く',next:'bathScene'},{label:'自販機へ飲み物を買いに行く',next:'vendingScene'},{label:'先に部屋へ戻る',next:'roomAlone'}]},
bathScene:{chapter:'第六章　小さな違和感',time:'22:43',place:'男湯',bg:'room',mood:'warm',chars:[{pos:'C',cls:'senior coat'}],name:'篠崎 正一',text:'湯船には篠崎先生がいた。\n\n「若いうちは旅行しなさい」\n\n湯気の向こうで言う。\n\n「年を取ると、行ける場所より行かなかった場所の方を覚えてる」\n\n少し寂しい言い方だった。\n\nそのあと黒田さんが入ってきた。\n\n三人で話したのは、天気と雪道と、明日の朝飯のことだけ。',next:'roomNight'},
vendingScene:{chapter:'第六章　小さな違和感',time:'22:41',place:'一階・自販機前',bg:'lobby',mood:'uneasy',chars:[{pos:'R',cls:'coat'}],text:'自販機の前に森川さんがいた。\n\n「酒のあとに缶コーヒー。体に悪そうですね」\n\n「締めだよ、締め」\n\nそう言って笑う。\n\nその時、廊下の奥で誰かが曲がった。\n\n一瞬だけ。\n\n服の色までは見えなかった。',choices:[{label:'誰だったか聞く',next:'vendingAsk',effect:()=>state.clues++},{label:'気にしない',next:'roomNight'}]},
vendingAsk:{chapter:'第六章　小さな違和感',time:'22:42',place:'一階・自販機前',bg:'lobby',mood:'uneasy',chars:[{pos:'R',cls:'coat'}],name:'森川 俊夫',text:'「今の？　さあ。千秋ちゃんじゃない？」\n\n「見えたんですか」\n\n「いや、適当」\n\n森川さんは缶を開ける。\n\n「この宿、曲がり角多いから誰がどこ行ったか分かんないな」\n\nその言い方だけ、妙に具体的だった。',next:'roomNight'},
roomAlone:{chapter:'第六章　小さな違和感',time:'22:40',place:'二階・楓の間',bg:'room',mood:'night',chars:[],text:'部屋へ戻る。\n\n急に静かだった。\n\n少し前まで十人以上の声が聞こえていたのに、襖一枚閉めるだけで別世界になる。\n\n窓の外では雪が横向きに流れている。\n\n僕はテレビをつけた。\n\n砂嵐まじりの画面。',next:'roomNight'},
roomNight:{chapter:'第七章　足音',time:'23:18',place:'二階・楓の間',bg:'room',night:true,mood:'night',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'風呂から戻った真帆は、髪を乾かしながら今日の出来事を思い出していた。\n\n「亜希さん面白いよね」\n\n「森川さんもうるさい」\n\n「千秋さん、なんかお父さんと微妙じゃない？」\n\n「分かる」\n\nどうでもいい話。\n\nでも、こういうどうでもいい話が一番楽しかった。',choices:[{label:'今日一番印象に残った人を聞く',next:'mahoPeople'},{label:'「旅行、来てよかった？」',next:'mahoTrip',effect:()=>state.aff.maho++},{label:'明日の予定を話す',next:'tomorrowPlan'}]},
mahoPeople:{chapter:'第七章　足音',time:'23:21',place:'二階・楓の間',bg:'room',night:true,mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「亜希さんかな。話しやすいし」\n\n少し考えてから続ける。\n\n「でも可奈子さんも好き。千秋さんも」\n\n「男は？」\n\n「篠崎先生」\n\n「俺は？」\n\n「宿泊客じゃないでしょ」\n\nちゃんと枠外に置かれていた。',next:'footsteps'},
mahoTrip:{chapter:'第七章　足音',time:'23:21',place:'二階・楓の間',bg:'room',night:true,mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「うん」\n\n即答だった。\n\n「来てよかった」\n\nそれだけ。\n\nでも、その言葉で十分だった。\n\n僕は何か気の利いたことを言おうとして、やめた。',next:'footsteps'},
tomorrowPlan:{chapter:'第七章　足音',time:'23:22',place:'二階・楓の間',bg:'room',night:true,mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「朝ごはん食べて、雪かき手伝って、写真撮って……」\n\n「温泉もう一回」\n\n「それも」\n\n「帰るの夕方でもいいか」\n\n「道路が開けばね」\n\n僕たちは明日の予定を、普通に立てた。',next:'footsteps'},
footsteps:{chapter:'第七章　足音',time:'23:47',place:'二階・楓の間',bg:'room',night:true,mood:'night',chars:[{pos:'L',cls:'female'}],text:'電気を消して、しばらく。\n\nギシ。\n\nギシ。\n\n廊下を歩く音。\n\n古い床だから、誰かが歩けばすぐ分かる。\n\n足音は近づいてきた。\n\nそして――\n\n僕たちの部屋の前で止まった。',next:'footsteps2'},
footsteps2:{chapter:'第七章　足音',time:'23:48',place:'二階・楓の間',bg:'room',night:true,mood:'night',chars:[],text:'何秒か。\n\n十秒か。\n\nもっと長かったかもしれない。\n\nノックはない。\n\n声もない。\n\nただ、誰かが襖の向こうに立っている。\n\nそんな気配だけがあった。',choices:[{label:'すぐに襖を開ける',next:'openDoor',effect:()=>{state.flags.lastBranch='footsteps2';state.clues++}},{label:'真帆を起こす',next:'wakeMaho',effect:()=>state.flags.lastBranch='footsteps2'},{label:'息を殺して様子を見る',next:'waitFootsteps',effect:()=>state.flags.lastBranch='footsteps2'}]},
openDoor:{chapter:'第七章　足音',time:'23:48',place:'二階廊下',bg:'corridor',night:true,mood:'night',chars:[],text:'勢いよく襖を開けた。\n\n廊下には誰もいない。\n\n……いや。\n\n突き当たりの曲がり角。\n\n黒い影が一瞬だけ見えた。',choices:[{label:'追いかける',next:'chase',effect:()=>state.flags.chased=true},{label:'追わない',next:'endNight'}]},
wakeMaho:{chapter:'第七章　足音',time:'23:49',place:'二階・楓の間',bg:'room',night:true,mood:'night',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「……なに？」\n\n「誰か、外にいる」\n\n真帆の眠そうな顔から、一瞬で表情が消えた。\n\n二人で耳を澄ます。\n\nやがて足音が、ゆっくり遠ざかっていった。\n\n「誰だろ」\n\n「トイレじゃない？」\n\nそう言った僕自身、あまり信じていなかった。',next:'endNight'},
waitFootsteps:{chapter:'第七章　足音',time:'23:50',place:'二階・楓の間',bg:'room',night:true,mood:'night',chars:[],text:'動かず待った。\n\nやがて、ギシ。\n\n足音はまた動き始める。\n\n僕たちの部屋から離れていく。\n\nそれだけだった。\n\nただの宿泊客かもしれない。\n\nそれでも、なぜ部屋の前で止まったのかは分からない。',next:'endNight'},
chase:{chapter:'第七章　足音',time:'23:49',place:'二階廊下',bg:'corridor',night:true,mood:'night',chars:[],text:'裸足のまま廊下へ飛び出した。\n\n曲がり角。\n階段。\n\n下へ降りる気配。\n\n追う。\n\n一階へ出た時には、もう誰もいなかった。\n\n玄関は閉まっている。\n\n遊技場も暗い。\n\n談話室も無人。',choices:[{label:'遊技場まで調べる',next:'chaseGame'},{label:'怖くなって部屋へ戻る',next:'endNight'}]},
chaseGame:{chapter:'第七章　足音',time:'23:51',place:'遊技場',bg:'gameroom',night:true,mood:'night',chars:[],text:'遊技場の電気をつけた。\n\n誰もいない。\n\nただ、将棋盤のそばにまた桂馬が落ちていた。\n\nさっき戻したはずなのに。\n\nその瞬間、背後の廊下で床が鳴った。',choices:[{label:'振り向く',next:'curiosityEnd'},{label:'そのまま走って部屋へ戻る',next:'endNight'}]},
curiosityEnd:{chapter:'BAD END',time:'23:52',place:'遊技場',bg:'gameroom',night:true,mood:'night',chars:[],text:'振り向いた。\n\nでも、そこに誰がいたのか。\n\n翌朝の僕は、うまく思い出せなかった。\n\nただ、後頭部がひどく痛んだ。\n\n第一夜で真相に近づきすぎたのかもしれない。',choices:[{label:'到達記録へ',next:()=>{ending('好奇心は猫を','遊技場まで追跡した結果、第一夜のうちに何者かと接触した。真相には近づいたが、記憶は曖昧なままだった。');return 'noop'}}]},
endNight:{chapter:'第一夜・終',time:'00:03',place:'二階・楓の間',bg:'room',night:true,mood:'snow',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「もう寝よ」\\n\\n真帆が布団に潜り込む。\\n\\n僕も電気を消した。\\n\\n窓の外では雪が降り続いている。\\n\\n鞄。\\n遊技場の物音。\\n電話の雑音。\\n部屋の前で止まった足音。\\n\\nどれも、事件と呼ぶには小さすぎる。\\n\\nだから僕は眠った。',choices:[{label:'翌朝へ',next:'day2Morning'}]},
day2Morning:{chapter:'第八章　雪の朝',time:'07:12',place:'二階・楓の間',bg:'room',mood:'snow',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「透司。起きて」\\n\\n肩を揺すられて目を開ける。\\n\\n障子の向こうが、妙に明るい。\\n\\n「雪、すごいよ」\\n\\n窓を開けると、昨日まで見えていた道路が消えていた。\\n白い斜面のように、雪が一面を埋めている。\\n\\n玄関前では、重蔵さんと千秋さんがもう雪かきを始めていた。',next:'morningHall'},
morningHall:{chapter:'第八章　雪の朝',time:'07:28',place:'一階・玄関前',bg:'arrival',mood:'snow',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'senior coat'},{pos:'R',cls:'female short'}],name:'香月 重蔵',text:'「夜中にもう一段積もった」\\n\\n重蔵さんが雪の壁にスコップを突き立てる。\\n\\n「除雪車は？」\\n\\n「県道までは来るだろうが、ここまで上がってくるのは午後になるかもしれん」\\n\\n電話はまだ不通。\\nラジオでは、山間部の積雪は平年の倍だと言っていた。',choices:[{label:'雪かきを手伝う',next:'snowWork',effect:()=>{state.aff.chiaki++;state.flags.helpedSnow=true}},{label:'朝食の準備を手伝う',next:'breakfastHelp',effect:()=>state.flags.helpedKitchen=true},{label:'寒いので談話室で待つ',next:'loungeMorning'}]},
snowWork:{chapter:'第八章　雪の朝',time:'07:42',place:'雪待庵・玄関前',bg:'arrival',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],name:'千秋',text:'「腰で押すの。腕だけだとすぐ疲れるよ」\\n\\n千秋さんに言われた通りにスコップを入れる。\\n\\n森川さんも遅れて外へ出てきた。\\n「旅先で雪かきまでさせられるとはなあ」\\n\\n口では文句を言いながら、案外まじめに働いている。\\n\\n三木はカメラを首から下げたまま、雪かきと撮影を交互にやっていた。',choices:[{label:'三木に「働け」と言う',next:'snowMiki',effect:()=>state.fun++},{label:'千秋と並んで作業する',next:'snowChiaki',effect:()=>state.aff.chiaki++},{label:'森川と作業する',next:'snowMorikawa',effect:()=>state.aff.morikawa++}]},
snowMiki:{chapter:'第八章　雪の朝',time:'08:01',place:'雪待庵・玄関前',bg:'arrival',mood:'play',chars:[{pos:'C',cls:'coat short'}],name:'三木 隆志',text:'「これも記録なんですよ」\\n\\n「雪かきしてる人を撮る前に、自分が雪かきしろ」\\n\\n「正論だ」\\n\\n三木は笑ってカメラを胸元にしまった。\\n\\nその拍子に、ポケットから黒い小さなケースがのぞいた。\\n昨日、亜希さんが拾って渡していたものだ。',next:'snowDone'},
snowChiaki:{chapter:'第八章　雪の朝',time:'08:03',place:'雪待庵・玄関前',bg:'arrival',mood:'warm',chars:[{pos:'L',cls:'female short'}],name:'千秋',text:'「父さん、昔から雪の日だけ機嫌悪いんだ」\\n\\n「雪国の旅館なのに？」\\n\\n「だからこそ」\\n\\n千秋さんは笑った。\\n\\n少し離れたところで重蔵さんが、道の向こうを何度も気にしている。\\n客が帰れないことを心配している――そう見えた。',next:'snowDone'},
snowMorikawa:{chapter:'第八章　雪の朝',time:'08:04',place:'雪待庵・玄関前',bg:'arrival',mood:'warm',chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「こういう時は若いのを働かせるんだよ」\\n\\n「森川さんも若いでしょう」\\n\\n「三十越えたら雪は見るもの。掘るものじゃない」\\n\\nそう言いながら、僕より大きな雪の塊を放り投げる。\\n\\n「……普通に元気じゃないですか」\\n\\n「編集者なめるな。締切前は三日寝ない」',next:'snowDone'},
snowDone:{chapter:'第八章　雪の朝',time:'08:23',place:'雪待庵・玄関前',bg:'arrival',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],text:'玄関前に、人が一人通れる道ができた。\\n\\n真帆と亜希さんが雪だるまを作っている。\\n\\n「雪かきの邪魔してない？」\\n\\n「芸術活動です」\\n\\n亜希さんが胸を張る。\\n\\n誰かが目と口に炭を入れ、篠崎先生が頭に手ぬぐいを載せた。\\n\\n気づけば全員が笑っていた。',next:'breakfast'},
breakfastHelp:{chapter:'第八章　雪の朝',time:'07:45',place:'厨房前',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'female'}],name:'啓子',text:'「あら、助かるわ」\\n\\n僕と真帆は配膳を手伝うことになった。\\n\\n焼き魚。味噌汁。卵焼き。山菜。\\n\\n「千秋ちゃん、家継ぐんですか？」\\n真帆が聞く。\\n\\n啓子さんの手が、ほんの一瞬だけ止まった。\\n\\n「さあ。あの子の人生だからね」',next:'breakfast'},
loungeMorning:{chapter:'第八章　雪の朝',time:'07:51',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'C',cls:'senior coat'},{pos:'R',cls:'coat'}],text:'談話室では黒田さんが新聞を読み、篠崎先生がラジオを聞いていた。\\n\\n「道路は午後まで駄目そうですね」\\n\\n篠崎先生が言う。\\n\\n黒田さんは新聞から顔を上げず、「そうですか」とだけ答えた。\\n\\n新聞の日付は昨日。\\nこの旅館の時間だけが、外の世界から切り離されていくようだった。',next:'breakfast'},
breakfast:{chapter:'第九章　朝食',time:'08:41',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'朝食は、昨日よりずっと賑やかだった。\\n\\n一晩過ごしただけなのに、みんな少しずつ遠慮がなくなっている。\\n\\n森川さんは篠崎先生の漬物を勝手につまみ、亜希さんは黒田さんに「もっと食べないと」とご飯をよそう。\\n\\n黒田さんが本気で困っている。\\n\\n真帆が僕の焼き魚の皮だけ持っていった。',choices:[{label:'「それ、俺の」',next:'fishFight',effect:()=>state.fun++},{label:'黙ってもう一切れ渡す',next:'fishKind',effect:()=>state.aff.maho++},{label:'森川さんの漬物も取る',next:'pickleWar',effect:()=>state.fun++}]},
fishFight:{chapter:'第九章　朝食',time:'08:43',place:'食堂',bg:'dining',mood:'play',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「皮いらないでしょ」\\n\\n「好きなんだけど」\\n\\n「昨日、残してた」\\n\\n「昨日は昨日だ」\\n\\n「小学生？」\\n\\n亜希さんが向かいで笑い出す。\\n\\n「二人って付き合ってないんだよね？」\\n\\nその質問で、今度は食卓全体がこっちを見た。',next:'relationshipTalk'},
fishKind:{chapter:'第九章　朝食',time:'08:43',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「いいの？」\\n\\n「どうぞ」\\n\\n「……ありがと」\\n\\n亜希さんが僕たちを見比べて、ニヤニヤしている。\\n\\n「それで付き合ってないって言うんだからねえ」\\n\\n真帆がむせた。',next:'relationshipTalk'},
pickleWar:{chapter:'第九章　朝食',time:'08:43',place:'食堂',bg:'dining',mood:'play',chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「おい、それ俺が狙ってたやつ」\\n\\n「早い者勝ちです」\\n\\n「若者が年長者を敬わん」\\n\\n「三十代で年長者面しないでください」\\n\\n篠崎先生が横で静かに笑った。\\n\\n「漬物で喧嘩できるなら平和ですね」',next:'relationshipTalk'},
relationshipTalk:{chapter:'第九章　朝食',time:'08:49',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],name:'真島 亜希',text:'「で、実際どうなの？」\\n\\n「何がですか」\\n\\n「透司くんと真帆ちゃん」\\n\\n逃げ道がない。\\n\\n食卓には十一人。\\n全員、こちらを見ている。',choices:[{label:'「友達です」',next:'relFriend'},{label:'「僕はその先を希望しています」',next:'relAttack',effect:()=>state.aff.maho+=2},{label:'真帆に答えさせる',next:'relMaho'}]},
relFriend:{chapter:'第九章　朝食',time:'08:50',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「そう。友達」\\n\\n真帆は即答した。\\n\\n即答しすぎて少し傷つく。\\n\\n「でも一緒に旅行するくらいには仲いいよ」\\n\\nあとから付け足した。\\n\\nそれで少し回復した。',next:'phoneReport'},
relAttack:{chapter:'第九章　朝食',time:'08:50',place:'食堂',bg:'dining',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'R',cls:'female short'}],name:'真帆',text:'「ちょっと！」\\n\\n顔が赤くなる。\\n\\n森川さんが箸を置いて拍手。\\n亜希さんまで乗る。\\n\\n「朝から若いねえ」\\n\\n「森川さん黙ってください！」\\n\\n旅館で一番うるさい朝食になった。',next:'phoneReport'},
relMaho:{chapter:'第九章　朝食',time:'08:50',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「なんで私に振るの」\\n\\n「本人の意思を尊重して」\\n\\n「そういう時だけ民主的にならないで」\\n\\n真帆はしばらく考えて、\\n「……まあ、嫌いじゃない」\\nと言った。\\n\\n食卓が妙に静かになった。\\n\\n僕の方が困った。',next:'phoneReport'},
phoneReport:{chapter:'第九章　朝食',time:'09:02',place:'食堂',bg:'dining',mood:'uneasy',chars:[{pos:'C',cls:'senior coat'}],name:'香月 重蔵',text:'朝食が終わる頃、重蔵さんが帳場から戻ってきた。\\n\\n「電話、完全に死んだ」\\n\\n「さっきまで雑音だけはしてたのに？」\\n\\n「線が切れたかもしれん」\\n\\n旅館の外にある引き込み線を見に行くには、腰までの雪を越える必要があるという。\\n\\n「道路が開けば問題ない」\\n\\n重蔵さんはそう言った。',next:'freeMorning'},
freeMorning:{chapter:'第十章　雪の午前',time:'09:27',place:'雪待庵',bg:'lobby',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat short'},{pos:'R',cls:'female short'}],text:'午前中は自由時間になった。\\n\\n雪かきの続き。\\n談話室でカード。\\n遊技場で卓球。\\n温泉。\\n写真。\\n\\nどこへ行っても、誰かがいる。\\n昨日までは知らない人だったのに、今日はもう「いつもの顔」に見えた。',choices:[{label:'三木と写真を撮りに行く',next:'photoWalk',effect:()=>state.aff.miki++},{label:'亜希・真帆・千秋と雪だるまを作る',next:'snowman',effect:()=>{state.aff.aki++;state.aff.chiaki++}},{label:'森川・黒田・篠崎とカードをする',next:'cards',effect:()=>state.aff.morikawa++}]},
photoWalk:{chapter:'第十章　雪の午前',time:'09:44',place:'旅館裏手',bg:'arrival',mood:'snow',chars:[{pos:'C',cls:'coat short'}],name:'三木 隆志',text:'「雪って、写真にすると難しいんですよ」\\n\\n三木は露出計を見ながら言う。\\n\\n「白ばっかりだから？」\\n\\n「そう。カメラが勝手に暗くしようとする」\\n\\n説明しながら、フィルムを交換する。\\n\\n昨日の黒いケースを地面に置き、別のケースをポケットから出した。\\n\\n見た目はほとんど同じだ。',choices:[{label:'ケースに印をつけないのか聞く',next:'photoMark',effect:()=>state.clues++},{label:'雪景色の撮り方を教えてもらう',next:'photoLesson'},{label:'真帆を撮ってもらう',next:'photoMaho',effect:()=>state.aff.maho++}]},
photoMark:{chapter:'第十章　雪の午前',time:'09:47',place:'旅館裏手',bg:'arrival',mood:'snow',chars:[{pos:'C',cls:'coat short'}],name:'三木 隆志',text:'「本当は書くんですけどね」\\n\\n三木は苦笑する。\\n\\n「昨日一本使い切って、空ケースと未使用がごちゃっとしてる」\\n\\n「大丈夫なんですか」\\n\\n「帰ったら全部整理します」\\n\\nそう言って、二つの黒いケースをまとめて上着のポケットへ入れた。',next:'midMorning'},
photoLesson:{chapter:'第十章　雪の午前',time:'09:50',place:'旅館裏手',bg:'arrival',mood:'warm',chars:[{pos:'C',cls:'coat short'}],name:'三木 隆志',text:'三木は僕の手にカメラを持たせた。\\n\\n「白い雪は少し明るめに撮る。人を入れると距離感も出ます」\\n\\nファインダー越しに旅館を見る。\\n\\n窓が一つだけ開いた。\\n誰かが顔を出した気がした。\\n\\nシャッターを切る前に、窓は閉じた。',next:'midMorning'},
photoMaho:{chapter:'第十章　雪の午前',time:'09:52',place:'旅館裏手',bg:'arrival',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat short'}],name:'真帆',text:'「なんで私だけ？」\\n\\n「記念」\\n\\n「透司も入れば」\\n\\n三木が笑って、僕たちを並ばせる。\\n\\n「もっと寄って」\\n\\n昨日と同じ言葉。\\n\\n真帆の肩が触れた瞬間、シャッターが落ちた。',next:'midMorning',flash:true},
snowman:{chapter:'第十章　雪の午前',time:'09:46',place:'玄関前',bg:'arrival',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'female short'},{pos:'R',cls:'female short'}],name:'真島 亜希',text:'「もっと大きくしよう」\\n\\n亜希さんの提案で、雪だるまは人間より大きくなった。\\n\\n千秋さんが旅館の古い笠を被せる。\\n真帆が炭で眉毛をつける。\\n\\n「怖くない？」\\n\\n「重蔵さんに似てる」\\n\\n千秋さんが言った瞬間、全員が吹き出した。',choices:[{label:'雪だるまを重蔵さんに見せる',next:'snowmanBoss',effect:()=>state.fun++},{label:'記念写真を撮る',next:'snowmanPhoto'},{label:'もう一体作る',next:'snowmanKing'}]},
snowmanBoss:{chapter:'第十章　雪の午前',time:'10:08',place:'玄関前',bg:'arrival',mood:'play',chars:[{pos:'C',cls:'senior coat'}],name:'香月 重蔵',text:'重蔵さんは雪だるまを見た。\\n\\n長い沈黙。\\n\\n「……俺はこんなに眉毛太くない」\\n\\nそこだった。\\n\\n千秋さんが腹を抱えて笑った。\\n\\n重蔵さんも、ほんの少しだけ口元を緩めた。',next:'midMorning'},
snowmanPhoto:{chapter:'第十章　雪の午前',time:'10:05',place:'玄関前',bg:'arrival',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'female short'},{pos:'R',cls:'female short'}],text:'三木を呼んで写真を撮ってもらう。\\n\\n亜希さんが真ん中。真帆と千秋さんが左右。\\n僕は雪だるまの後ろから顔だけ出した。\\n\\n「何それ」\\n\\n真帆が笑う。\\n\\nパシャ。\\n\\n写真に残るのは、笑っている僕たちだけだ。',next:'midMorning',flash:true},
snowmanKing:{chapter:'BAD END?',time:'10:41',place:'玄関前',bg:'arrival',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'female short'},{pos:'R',cls:'female short'}],text:'二体目。\\n三体目。\\n四体目。\\n\\n気づけば僕たちは雪待庵の前に雪だるま軍団を築いていた。\\n\\n「透司、これ何の旅行だっけ」\\n\\n「雪だるま合宿」\\n\\nこのあと昼まで作り続けた。',choices:[{label:'さすがに中へ戻る',next:'midMorning'},{label:'雪だるま王国を完成させる',next:()=>{ending('雪だるま大将','雪待庵の前に十三体の雪だるまを築き、事件の前に体力を使い果たした。');return 'noop'}}]},
cards:{chapter:'第十章　雪の午前',time:'09:43',place:'談話室',bg:'lounge',mood:'play',chars:[{pos:'L',cls:'senior coat'},{pos:'C',cls:'coat'},{pos:'R',cls:'coat'}],text:'森川さんの提案で大富豪をすることになった。\\n\\n黒田さんが意外に強い。\\n篠崎先生はルールの地方差にうるさい。\\n森川さんは負けるたびに「編集部ルールでは違う」と言い出す。\\n\\n「どんな編集部ですか」\\n\\n「俺がルールだ」\\n\\n最悪の編集長だった。',choices:[{label:'森川を徹底的に潰す',next:'cardsAttack',effect:()=>state.fun++},{label:'黒田の表情を観察する',next:'cardsKuroda',effect:()=>state.clues++},{label:'篠崎先生と組む',next:'cardsSensei'}]},
cardsAttack:{chapter:'第十章　雪の午前',time:'10:01',place:'談話室',bg:'lounge',mood:'play',chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「お前、性格悪いな！」\\n\\n「ゲームですから」\\n\\n「そういう奴が社会に出ると出世するんだ」\\n\\n「褒めてます？」\\n\\n「全然」\\n\\n森川さんは笑いながらカードを投げた。',next:'midMorning'},
cardsKuroda:{chapter:'第十章　雪の午前',time:'10:02',place:'談話室',bg:'lounge',mood:'uneasy',chars:[{pos:'C',cls:'coat'}],text:'黒田さんは勝っても負けても、ほとんど表情が変わらない。\\n\\nただ一度だけ。\\n\\n森川さんが何気なく「東京の本社勤めは大変だろ」と言った時、手が止まった。\\n\\nほんの一秒。\\n\\nすぐにカードを出した。',next:'midMorning'},
cardsSensei:{chapter:'第十章　雪の午前',time:'10:04',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'C',cls:'senior coat'}],name:'篠崎 正一',text:'「若い人と遊ぶのはいいですね」\\n\\n先生は本当に楽しそうだった。\\n\\n「教師を辞めてから、若い人と話す機会が減りまして」\\n\\n「何の先生だったんです？」\\n\\n「国語です。嘘を見抜く授業はしませんでしたが」\\n\\nなぜか森川さんが笑った。',next:'midMorning'},
midMorning:{chapter:'第十一章　それぞれの午前',time:'10:27',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat short'},{pos:'R',cls:'female short'}],text:'十時半を過ぎる頃には、旅館全体がすっかり休日の合宿所みたいになっていた。\\n\\n亜希さんは台所で啓子さんを手伝い、三木は写真を整理し、篠崎先生は新聞のクロスワード。\\n\\n黒田さんは一人で窓際。\\n森川さんは雑誌を読みながら、時々メモを取っている。',next:'smallAbsence'},
smallAbsence:{chapter:'第十一章　それぞれの午前',time:'10:38',place:'談話室',bg:'lounge',mood:'uneasy',chars:[{pos:'L',cls:'female'}],text:'真帆がいない。\\n\\nさっきまでいたはずなのに。\\n\\n「真帆、どこ行った？」\\n\\n誰に聞いても知らない。\\n\\n五分ほどして、本人は裏口の方から戻ってきた。\\n\\n「どこ行ってたんだよ」\\n\\n「ちょっと」\\n\\nそれ以上、答えなかった。',choices:[{label:'理由を聞く',next:'askMahoAbsence',effect:()=>state.clues++},{label:'追及しない',next:'lunchPrep'},{label:'「怪しいな」と冗談を言う',next:'jokeMahoAbsence',effect:()=>state.fun++}]},
askMahoAbsence:{chapter:'第十一章　それぞれの午前',time:'10:39',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「秘密」\\n\\n「何それ」\\n\\n「旅行中に秘密くらいあってもいいでしょ」\\n\\n笑っている。\\n\\n本気で隠しているのか、ただ僕をからかっているだけなのか分からない。\\n\\nこの時の僕は、深く考えなかった。',next:'lunchPrep'},
jokeMahoAbsence:{chapter:'第十一章　それぞれの午前',time:'10:39',place:'談話室',bg:'lounge',mood:'play',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「犯人みたいに言わないで」\\n\\n「何の犯人？」\\n\\n「知らない」\\n\\n二人で笑った。\\n\\nまだこの旅館には、“犯人”なんて言葉が冗談でしか存在していなかった。',next:'lunchPrep'},
lunchPrep:{chapter:'第十二章　昼',time:'11:52',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'C',cls:'female'},{pos:'R',cls:'coat'}],text:'昼は簡単なうどんだった。\\n\\n「客を閉じ込めておいてうどんだけ？」\\n森川さんが言う。\\n\\n啓子さんが笑う。\\n「嫌なら外で食べてきてください」\\n\\n「雪しかない！」\\n\\nとうとう女将さんまで扱い方を覚えていた。',next:'lunchConversation'},
lunchConversation:{chapter:'第十二章　昼',time:'12:11',place:'食堂',bg:'dining',mood:'warm',chars:[{pos:'L',cls:'female short'},{pos:'C',cls:'coat short'},{pos:'R',cls:'coat'}],text:'食後。\\n\\n三木がテーブルにフィルムケースをいくつか並べ、亜希さんに昨日の写真の話をしている。\\n\\n森川さんが横から一つ手に取る。\\n\\n「これ全部同じに見えるな」\\n\\n「実際ほぼ同じです」\\n\\n「間違えないの？」\\n\\n「たまに」\\n\\n三木が笑った。',next:'caseShift'},
caseShift:{chapter:'第十二章　昼',time:'12:13',place:'食堂',bg:'dining',mood:'uneasy',chars:[{pos:'L',cls:'female short'},{pos:'C',cls:'coat short'},{pos:'R',cls:'coat'}],text:'その時、啓子さんが盆を置いた。\\n\\nテーブルの端のケースが一つ転がる。\\n\\n亜希さんが拾い、三木の方へ戻した。\\n森川さんが別のケースを指先で寄せる。\\n三木はまとめてポケットへ。\\n\\n一瞬のことだった。\\n\\n誰も気にしない。\\n僕も気にしなかった。',next:'afternoonChoice'},
afternoonChoice:{chapter:'第十三章　午後',time:'13:04',place:'雪待庵',bg:'lobby',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'female short'},{pos:'R',cls:'coat short'}],text:'午後になっても除雪車は来なかった。\\n\\n重蔵さんによると、下の県道で車が立ち往生しているらしい。\\n\\n「今日は無理かもしれん」\\n\\nさすがに何人かの顔から笑いが消えた。\\n\\nそれでも、できることは何もない。',choices:[{label:'真帆と温泉へ行く',next:'afternoonBath',effect:()=>state.aff.maho++},{label:'三木の写真整理を手伝う',next:'filmSort',effect:()=>{state.aff.miki++;state.clues++}},{label:'千秋と旅館の中を案内してもらう',next:'innTour',effect:()=>state.aff.chiaki++}]},
afternoonBath:{chapter:'第十三章　午後',time:'13:26',place:'湯上がり処',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'湯上がりに牛乳を飲んでいると、真帆が女湯から出てきた。\\n\\n「何見てるの」\\n\\n「別に」\\n\\n「今、絶対見てた」\\n\\n髪をまとめた真帆は、いつもと少し違って見えた。\\n\\n僕は牛乳を一気に飲んだ。',next:'afternoonQuiet'},
filmSort:{chapter:'第十三章　午後',time:'13:23',place:'三木の部屋',bg:'room',mood:'uneasy',chars:[{pos:'C',cls:'coat short'}],name:'三木 隆志',text:'「悪い、これ日付順に並べてもらえる？」\\n\\nフィルムケース、メモ帳、レンズ、電池。\\n机の上はひどい有様だった。\\n\\n黒いケースの底には、小さく数字が書かれているものと、何も書かれていないものがある。\\n\\n「これ、何も書いてないですよ」\\n\\n「あれ？　どれだろ」\\n\\n三木は首をかしげた。',choices:[{label:'昨日亜希さんが拾った物では？',next:'filmMemory',effect:()=>state.clues+=2},{label:'気にせず整理する',next:'afternoonQuiet'}]},
filmMemory:{chapter:'第十三章　午後',time:'13:25',place:'三木の部屋',bg:'room',mood:'uneasy',chars:[{pos:'C',cls:'coat short'}],name:'三木 隆志',text:'「そうだったかな」\\n\\n三木はケースを受け取り、光に透かすように眺めた。\\n\\n「まあ、帰れば分かるよ。現像すれば」\\n\\nそう言って机の隅に置く。\\n\\nその時、廊下から誰かの足音がした。\\n\\n三木が扉を見る。\\n\\n足音は、そのまま通り過ぎた。',next:'afternoonQuiet'},
innTour:{chapter:'第十三章　午後',time:'13:20',place:'雪待庵・館内',bg:'corridor',mood:'warm',chars:[{pos:'L',cls:'female short'}],name:'千秋',text:'「お客さんが入れるのはここまで」\\n\\n千秋さんが案内してくれる。\\n\\n二階客室。談話室。遊技場。浴場。\\n\\n厨房の奥には家族の生活スペース。\\n帳場の裏には古い事務室。\\n\\n「あっちは？」\\n\\n「物置。昔の布団とか置いてるだけ」\\n\\n廊下の突き当たりに、小さな扉があった。',next:'afternoonQuiet'},
afternoonQuiet:{chapter:'第十四章　静かな午後',time:'14:18',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'senior coat'},{pos:'R',cls:'female short'}],text:'午後二時を過ぎると、みんな少し疲れて静かになった。\\n\\n篠崎先生はうたた寝。\\n黒田さんは本を読む。\\n可奈子さんは編み物。\\n亜希さんと真帆は雑誌を眺めている。\\n\\n森川さんの姿だけがなかった。\\n\\nでも、誰も気にしなかった。\\n旅館の中なら、どこかにいる。',next:'morikawaReturn'},
morikawaReturn:{chapter:'第十四章　静かな午後',time:'14:31',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'R',cls:'coat'}],name:'森川 俊夫',text:'「いやあ、寝た寝た」\\n\\n森川さんが戻ってくる。\\n\\n髪が少し濡れている。\\n\\n「風呂ですか？」\\n\\n「部屋で寝てた」\\n\\n「髪、濡れてますよ」\\n\\n「顔洗ったんだよ」\\n\\nそれだけの会話。\\n\\n後になって思えば、妙な会話だった。\\nこの時は何も思わなかった。',next:'akiNote'},
akiNote:{chapter:'第十四章　静かな午後',time:'14:46',place:'談話室',bg:'lounge',mood:'uneasy',chars:[{pos:'L',cls:'female short'},{pos:'R',cls:'female'}],name:'真島 亜希',text:'「ちょっと借りていい？」\\n\\n亜希さんが三木のボールペンを借り、手帳に何かを書いた。\\n\\n書き終わるとページを折り、バッグにしまう。\\n\\n「何書いたんです？」\\n\\n「忘れたくないこと」\\n\\n笑って、それ以上は言わなかった。',next:'powerFlicker'},
powerFlicker:{chapter:'第十四章　静かな午後',time:'15:02',place:'談話室',bg:'lounge',mood:'uneasy',chars:[],text:'ブツッ。\\n\\n一瞬、照明が消えた。\\n\\nすぐ戻る。\\n\\n「停電？」\\n\\n重蔵さんが廊下から声を上げる。\\n\\n「雪で電圧が落ちただけだ。よくある」\\n\\n誰かが笑った。\\n\\nでも、その一瞬の暗闇の中で、椅子が動く音がした。',next:'teaTime'},
teaTime:{chapter:'第十五章　夕方まで',time:'15:21',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat short'},{pos:'R',cls:'female short'}],text:'啓子さんがお茶と饅頭を持ってきた。\\n\\nまた全員が集まる。\\n\\n雪。温泉。くだらない話。\\n\\nこの二日で、僕たちはずいぶん仲良くなった。\\n\\nだから、そのあと誰かが死ぬなんて。\\n\\n本当に、誰も考えていなかった。',choices:[{label:'全員でしりとりをする',next:'shiritori',effect:()=>state.fun++},{label:'篠崎先生の昔話を聞く',next:'senseiStory'},{label:'亜希さんと話す',next:'akiTalk',effect:()=>state.aff.aki++}]},
shiritori:{chapter:'第十五章　夕方まで',time:'15:34',place:'談話室',bg:'lounge',mood:'play',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'なぜか十一人でしりとりが始まった。\\n\\n森川さんが「ルール」と言って一巡目で負ける。\\n\\n「る、だからセーフだろ！」\\n\\n「最後“る”ですよ」\\n\\n「編集部ルールでは――」\\n\\n「出た」\\n\\n全員から一斉に言われた。',next:'preDinner'},
senseiStory:{chapter:'第十五章　夕方まで',time:'15:38',place:'談話室',bg:'lounge',mood:'warm',chars:[{pos:'C',cls:'senior coat'}],name:'篠崎 正一',text:'「昔、修学旅行で一人いなくなりましてね」\\n\\n先生の話にみんなが耳を傾ける。\\n\\n「大騒ぎして探したら、旅館の押し入れで寝てた」\\n\\n「なんでですか」\\n\\n「本人も分からないと言ってました」\\n\\n笑い話だった。\\n\\n“人がいなくなる”という言葉が、妙に耳に残った。',next:'preDinner'},
akiTalk:{chapter:'第十五章　夕方まで',time:'15:39',place:'談話室・窓際',bg:'lounge',mood:'warm',chars:[{pos:'L',cls:'female short'}],name:'真島 亜希',text:'「会社戻りたくないなあ」\\n\\n亜希さんは窓の外を見ながら言った。\\n\\n「仕事嫌いなんですか？」\\n\\n「嫌いじゃない。でも最近ちょっと面倒なことあって」\\n\\n「面倒なこと？」\\n\\n「大人には色々あるの」\\n\\n笑ってごまかした。\\n\\nその直後、彼女は何かを思い出したように鞄を確認した。',next:'preDinner'},
preDinner:{chapter:'第十六章　夕食前',time:'16:52',place:'二階廊下',bg:'corridor',mood:'uneasy',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「一回部屋戻ろう」\\n\\n夕食まで少し時間がある。\\n\\n真帆と二階へ上がる。\\n\\n廊下を歩いていると、三木の部屋の前で立ち止まった。\\n\\n襖が、指一本ぶんほど開いている。\\n\\n中から音はしない。',choices:[{label:'声をかける',next:'callMiki',effect:()=>state.clues++},{label:'勝手に入らない',next:'roomBeforeDinner'},{label:'「寝てるだけだろ」と閉める',next:'closeMikiDoor'}]},
callMiki:{chapter:'第十六章　夕食前',time:'16:53',place:'三木の部屋前',bg:'corridor',mood:'uneasy',chars:[{pos:'L',cls:'female'}],name:'透司',text:'「三木さん？」\\n\\n返事はない。\\n\\nもう一度。\\n\\n「三木さん？」\\n\\n中から物音もしない。\\n\\n真帆が僕を見る。\\n\\n「寝てるんじゃない？」\\n\\n僕はそれ以上、声をかけなかった。',next:'roomBeforeDinner'},
closeMikiDoor:{chapter:'第十六章　夕食前',time:'16:53',place:'三木の部屋前',bg:'corridor',mood:'uneasy',chars:[],text:'開いていた襖をそっと閉める。\\n\\nその時、中から微かに何かの匂いがした。\\n\\n薬品のような。\\n酒のような。\\n\\n何の匂いかは分からない。\\n\\n「どうしたの？」\\n\\n「いや、何でもない」',next:'roomBeforeDinner'},
roomBeforeDinner:{chapter:'第十六章　夕食前',time:'17:09',place:'二階・楓の間',bg:'room',mood:'warm',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「明日には帰れるかな」\\n\\n「たぶん」\\n\\n「帰れなかったら？」\\n\\n「もう一泊」\\n\\n「授業始まるよ」\\n\\n「じゃあ大学に電話」\\n\\n言ってから二人で顔を見合わせた。\\n\\n電話は、切れている。',next:'dinnerGather'},
dinnerGather:{chapter:'第十七章　夕食に来ない人',time:'17:58',place:'食堂',bg:'dining',mood:'uneasy',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'senior coat'},{pos:'R',cls:'coat'}],text:'夕食の膳が並ぶ。\\n\\n一人。二人。三人。\\n\\nみんな集まってくる。\\n\\nでも、一つだけ席が空いていた。\\n\\n三木隆志の席。\\n\\n「写真でも撮ってるんじゃない？」\\n亜希さんが言う。\\n\\n千秋さんが首を振る。\\n\\n「外にはいなかったよ」',next:'waitMiki'},
waitMiki:{chapter:'第十七章　夕食に来ない人',time:'18:04',place:'食堂',bg:'dining',mood:'uneasy',chars:[{pos:'L',cls:'female short'},{pos:'C',cls:'coat'},{pos:'R',cls:'female'}],name:'啓子',text:'「三木さん、呼んできてもらえる？」\\n\\n誰にともなく言った。\\n\\n一瞬、全員が互いを見る。\\n\\n「僕、行きます」\\n\\n立ち上がった自分の声が、妙に大きく聞こえた。',choices:[{label:'一人で呼びに行く',next:'goMikiRoom'},{label:'真帆について来てもらう',next:'goMikiWithMaho',effect:()=>state.aff.maho++},{label:'森川さんに頼む',next:'moriGoMiki'}]},
goMikiWithMaho:{chapter:'第十七章　夕食に来ない人',time:'18:06',place:'二階廊下',bg:'corridor',mood:'uneasy',chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「ただ寝てるだけだよ」\\n\\n真帆が言う。\\n\\n「うん」\\n\\nでも、さっき襖の前で声をかけた時のことを思い出す。\\n\\n返事はなかった。\\n\\n廊下の突き当たり。\\n三木の部屋。\\n\\n襖は、また少し開いていた。',next:'mikiDoor'},
moriGoMiki:{chapter:'第十七章　夕食に来ない人',time:'18:05',place:'食堂',bg:'dining',mood:'uneasy',chars:[{pos:'C',cls:'coat'}],name:'森川 俊夫',text:'「俺？」\\n\\n森川さんは苦笑した。\\n\\n「まあいいけど」\\n\\nその時、真帆が僕の袖を引く。\\n\\n「透司も行こう」\\n\\n結局、僕たち三人で二階へ上がることになった。',next:'mikiDoor'},
goMikiRoom:{chapter:'第十七章　夕食に来ない人',time:'18:06',place:'二階廊下',bg:'corridor',mood:'uneasy',chars:[],text:'一人で階段を上がる。\\n\\n昼間まで賑やかだった廊下が、急に長く見える。\\n\\n三木の部屋。\\n\\n襖は、また少し開いていた。',next:'mikiDoor'},
mikiDoor:{chapter:'第十八章　最初の死',time:'18:07',place:'三木の部屋前',bg:'corridor',mood:'night',night:true,chars:[],text:'「三木さん」\\n\\n返事はない。\\n\\n指をかける。\\n\\n襖が、音もなく滑った。',next:'mikiRoom1'},
mikiRoom1:{chapter:'第十八章　最初の死',time:'18:07',place:'三木の部屋',bg:'room',mood:'night',night:true,chars:[],text:'最初に見えたのは、倒れた湯呑みだった。\\n\\n畳に茶が染みている。\\n座布団がずれている。\\n机の引き出しが半分開いている。\\n\\nそして、家具の陰から――\\n\\n人の脚が見えた。',next:'mikiRoom2'},
mikiRoom2:{chapter:'第十八章　最初の死',time:'18:08',place:'三木の部屋',bg:'room',mood:'night',night:true,chars:[],text:'三木隆志は、畳の上に倒れていた。\\n\\n目を閉じている。\\n\\n呼んでも動かない。\\n\\n首元に、不自然な跡。\\n\\nすぐに分かった。\\n\\n眠っているんじゃない。\\n\\n事故でもない。\\n\\n三木さんは――殺されていた。',choices:[{label:'食堂のみんなを呼ぶ',next:'murderAlarm'},{label:'部屋の中を見回す',next:'murderLook',effect:()=>state.clues++}]},
murderLook:{chapter:'第十八章　最初の死',time:'18:08',place:'三木の部屋',bg:'room',mood:'night',night:true,chars:[],text:'手を触れないように、目だけで部屋を見る。\\n\\n机。カメラ。バッグ。フィルムケース。\\n\\n何かを探したように、荷物が少しだけ乱れている。\\n\\n財布はある。\\n時計もある。\\n\\n金目当てには見えなかった。\\n\\n廊下から足音が近づく。',next:'murderAlarm'},
murderAlarm:{chapter:'第十八章　最初の死',time:'18:12',place:'三木の部屋前',bg:'corridor',mood:'night',night:true,chars:[{pos:'L',cls:'female'},{pos:'C',cls:'senior coat'},{pos:'R',cls:'coat'}],text:'叫び声を聞いて、全員が二階へ集まってきた。\\n\\n可奈子さんが三木さんのそばに膝をつく。\\n\\n数秒。\\n\\nゆっくり首を振った。\\n\\n「……亡くなってる」\\n\\n誰も声を出さなかった。\\n\\n廊下の向こうで、風が窓を鳴らした。',next:'lockedTruth'},
lockedTruth:{chapter:'第十九章　この中にいる',time:'18:29',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],name:'森川 俊夫',text:'「外から入った奴じゃないのか」\\n\\n玄関。裏口。窓。\\n\\n重蔵さんと黒田さんが確認した。\\n\\n外から入った足跡はない。\\n裏口の雪も崩れていない。\\n窓はどれも内側から閉まっている。\\n\\nそして電話は死んでいる。\\n道路は雪で塞がれている。',next:'inside'},
inside:{chapter:'第十九章　この中にいる',time:'18:36',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'L',cls:'female short'},{pos:'C',cls:'senior coat'},{pos:'R',cls:'female'}],name:'真島 亜希',text:'「じゃあ……」\\n\\n亜希さんの声が震えた。\\n\\n誰も続きを言わない。\\n\\n言わなくても分かる。\\n\\nこの旅館にいる十一人。\\n\\nいや。\\n\\n三木さんを除けば、十人。\\n\\nその中に――\\n\\n人を殺した誰かがいる。',choices:[{label:'全員を食堂に集めたままにする',next:'groupDecision',effect:()=>state.flags.keepTogether=true},{label:'三木さんの行動を整理する',next:'timelineStart',effect:()=>state.clues++},{label:'一度、自分の部屋へ戻る',next:'roomAfterMurder'}]},
groupDecision:{chapter:'第二十章　最初の夜',time:'18:42',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'L',cls:'female'},{pos:'C',cls:'senior coat'},{pos:'R',cls:'coat'}],name:'透司',text:'「誰も一人にならない方がいいと思います」\\n\\n自分で言って、背筋が冷えた。\\n\\n“誰も一人にならない”。\\n\\nつまり、ここにいる誰かを信用してはいけないということだ。\\n\\n昨日まで笑っていた人たちを。',choices:[{label:'全員でこのまま食堂に残る',next:'chapterTwoEnd'},{label:'まずアリバイを確認する',next:'timelineStart'}]},
timelineStart:{chapter:'第二十章　最初の夜',time:'18:47',place:'食堂',bg:'dining',mood:'uneasy',chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'三木さんを最後に見たのは誰か。\\n\\n午後、誰がどこにいたか。\\n\\nみんなで思い出す。\\n\\nだが、不思議なことに――\\n\\n誰も一日中誰かと一緒にいたわけではない。\\n\\nほんの十分。\\nほんの十五分。\\n\\n誰にでも、一人になる時間があった。',choices:[{label:'続きを整理する',next:'chapterTwoEnd'}]},
roomAfterMurder:{chapter:'第二十章　最初の夜',time:'18:44',place:'二階・楓の間',bg:'room',mood:'night',night:true,chars:[{pos:'L',cls:'female'}],name:'真帆',text:'「透司」\\n\\n真帆が僕の腕をつかんだ。\\n\\n「一人で行かないで」\\n\\n声が震えている。\\n\\n僕も怖かった。\\n\\n殺人犯がいる。\\n\\nそれも、昨日一緒に笑った人たちの中に。',choices:[{label:'真帆と一緒に食堂へ戻る',next:'groupDecision'},{label:'部屋の鍵を確認する',next:'keyCheck',effect:()=>state.clues++}]},
keyCheck:{chapter:'第二十章　最初の夜',time:'18:46',place:'二階・楓の間',bg:'room',mood:'uneasy',night:true,chars:[],text:'鍵を確認する。\\n\\n古い旅館の簡単な錠。\\n\\n内側からなら閉められる。\\n\\nでも、これで安全と言えるのか。\\n\\n昨夜、誰かはこの部屋の前まで来ていた。\\n\\n僕は昨日とは違う意味で、廊下の音を意識した。',next:'groupDecision'},
chapterTwoEnd:{chapter:'第二部・開幕',time:'19:03',place:'食堂',bg:'dining',mood:'night',night:true,chars:[{pos:'L',cls:'female'},{pos:'C',cls:'coat'},{pos:'R',cls:'female short'}],text:'夕食は、誰も箸をつけなかった。\\n\\n外は吹雪。\\n電話は不通。\\n道路は閉ざされている。\\n\\nそして、この中に殺人犯がいる。\\n\\n楽しかった旅行は、ここで終わった。\\n\\n――ここから先は、誰を信じるかで夜が変わる。',choices:[{label:'次の章へ（近日追加）',next:()=>{ending('第一の死','二日目の夕方、最初の殺人が起きた。閉ざされた雪待庵で、十人の夜が始まる。');return 'noop'}}]}
};
SCENES.noop={text:'',next:null};

$('#newGame').addEventListener('click',()=>{initAudio();state={scene:'prologue1',flags:{},aff:{maho:0,chiaki:0,morikawa:0,miki:0,aki:0},clues:0,fun:0,seen:{},log:[],endings:meta().endings||[]};title.hidden=true;game.hidden=false;render('prologue1')});
$('#continueGame').addEventListener('click',manualLoad);$('#chapterSelect').addEventListener('click',()=>{initAudio();title.hidden=true;game.hidden=false;state.scene='prologue1';render('prologue1')});$('#openEndings').addEventListener('click',showEndings);
$('.textbox').addEventListener('click',e=>{if(e.target.closest('button'))return;advance()});$('#saveBtn').addEventListener('click',manualSave);$('#loadBtn').addEventListener('click',manualLoad);$('#logBtn').addEventListener('click',openLog);$('#settingsBtn').addEventListener('click',()=>$('#settingsPanel').classList.add('open'));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).classList.remove('open')));$('#openEndings').addEventListener('click',showEndings);$('#bgmVol').addEventListener('input',e=>{if(bgmGain)bgmGain.gain.value=e.target.value/100});$('#seVol').addEventListener('input',e=>{if(seGain)seGain.gain.value=e.target.value/100});$('#skipToggle').addEventListener('click',e=>{skip=!skip;e.target.textContent=skip?'ON':'OFF'});
showTitle();
})();
</script>
</body>
